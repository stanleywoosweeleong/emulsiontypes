<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b5e6e">
<meta name="color-scheme" content="light only">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FormuLab 剂型通</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="FormuLab 剂型通">
<style>
:root{
  --bg:#f3f6f5; --panel:#ffffff; --ink:#10241f; --muted:#4a5f5a; --soft:#2f4640; --line:#d8e0dd;
  --water:#1b5e6e; --water-soft:#dceef2; --oil:#c98a1b; --oil-soft:#fbefd6;
  --powder:#8a8578; --powder-soft:#ebe8e0; --ok:#2e7d4f; --warn:#b8471b; --warn-soft:#fbe6dc;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{color-scheme:light only}
html{font-size:18px}
html,body{margin:0;background:var(--bg)!important;color:var(--ink);font:600 1rem/1.6 "PingFang SC",-apple-system,system-ui,"Noto Sans CJK SC","Noto Sans SC","Segoe UI",Roboto,sans-serif;letter-spacing:.01em;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

header{position:sticky;top:0;z-index:10;background:var(--water);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:1.2rem;min-width:0;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
html.xl header h1 small{display:none}
header h1 small{font-weight:400;opacity:.8;font-size:0.867rem;margin-left:6px}
#langBtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:5px 10px;min-width:48px;font-weight:600}

main{padding:14px 14px calc(78px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.view{display:none}.view.on{display:block}
h2{font-size:1.133rem;font-weight:700;margin:18px 0 8px}
p.lead{color:var(--ink);margin:0 0 12px;font-size:0.94rem;line-height:1.45;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:0;padding:9px 2px 7px;color:var(--soft);font-size:0.85rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;fill:currentColor}
nav button.on{color:var(--water)}

/* library */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font-size:0.9rem}
.chip.on{background:var(--water-soft);color:var(--water);border-color:var(--water);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.card>button.head{width:100%;background:none;border:0;text-align:left;padding:12px 12px;display:flex;align-items:center;gap:12px}
.head .jar{flex:0 0 46px}
.head .t{flex:1;min-width:0}
.head .code{font-weight:800;font-size:1.267rem;letter-spacing:.4px}
.head .code em{font-style:normal;font-weight:600;font-size:0.9rem;color:var(--soft);margin-left:8px}
.head .sub{font-size:0.92rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .chev{color:var(--muted);transition:transform .2s}
.card.open .chev{transform:rotate(90deg)}
.body{display:none;padding:0 12px 12px;border-top:1px dashed var(--line)}
.card.open .body{display:block}
.row{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:0.933rem}
.row:last-child{border-bottom:0}
.row .k{color:var(--soft);font-size:0.867rem;font-weight:600;padding-top:1px}
ul.pc{margin:0;padding-left:0;list-style:none}
ul.pc li{padding-left:20px;position:relative;margin:2px 0}
ul.pc li::before{position:absolute;left:0;font-weight:700}
ul.pro li::before{content:"✓";color:var(--ok)}
ul.con li::before{content:"✗";color:var(--warn)}
.tag{display:inline-block;font-size:0.85rem;padding:2px 8px;border-radius:6px;margin:2px 4px 2px 0}
.tag.water{background:var(--water-soft);color:var(--water)}
.tag.oil{background:var(--oil-soft);color:#7a5210}
.tag.powder{background:var(--powder-soft);color:#5b574d}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.dots{letter-spacing:2px;color:var(--water)}

/* segmented buttons */
.seg{display:grid;gap:6px;margin-bottom:4px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:10px 8px;font-size:0.94rem;font-weight:600;line-height:1.3;text-align:center;min-height:38px}
.seg button.on{background:var(--water-soft);border-color:var(--water);color:var(--water);font-weight:800}
.seg.multi button{text-align:left;padding:10px 12px}
.seg.codes button{padding:7px 2px;font-size:0.867rem;font-weight:600;letter-spacing:.3px}
.seg.codes button.on{font-weight:700}
.seg-share{display:block;width:100%;margin-top:10px;background:#25D366;color:#fff;border:0;border-radius:8px;padding:12px;font-size:1rem;font-weight:700}
.opt.banned{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);font-weight:700;text-align:left}
.opt.banned .x{font-size:1.2rem;font-weight:900;margin-right:2px}
.opt.banned.on{background:var(--warn);color:#fff}
.cmpbar{background:var(--water-soft);border:1px solid var(--water);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cmpbar b{flex:1}
.cmptable{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:12px}
.cmptable table{table-layout:fixed}
.cmptable th:first-child,.cmptable td:first-child{width:34%}
.cmptable td.win{background:#dff3e6;font-weight:800}
.cmptable .dots{font-size:0.9rem}
.rc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff}
.rc-h{font-weight:800;font-size:1rem;color:var(--water);margin-bottom:4px}
.rc-k{display:block;font-size:0.85rem;font-weight:700;color:var(--soft);margin-top:6px}
.rc-v{font-size:0.94rem}
.about{margin-top:14px;text-align:center}
.about .in{padding:4px 12px 14px}
.about .qr{display:block;width:min(220px,60vw);margin:0 auto 8px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:10px}
.about .qr svg{width:100%;height:auto;display:block}
.about .lnk{font-size:0.9rem;margin:6px 0 10px}
.about .lnk a{color:var(--water);font-weight:700;word-break:break-all}
.about .row2{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.about .cred{margin-top:12px;font-size:0.94rem;text-align:left;border-top:1px solid var(--line);padding-top:10px}
.grp{font-size:0.9rem;font-weight:800;color:var(--water);margin:8px 0 6px;letter-spacing:.02em}
.qty{margin-left:auto;border:1px solid var(--water);background:#fff;color:var(--water);border-radius:6px;padding:2px 8px;font-size:0.85rem;font-weight:800;white-space:nowrap}
.seg-name{font-size:0.85rem;color:var(--soft);margin:2px 0 6px}
.calc label.opt{display:flex;font-size:0.9rem;color:var(--ink);margin-top:0}
/* settings block (chooser / mix) */
.settings{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.settings h3{margin:0 0 8px;font-size:0.967rem;font-weight:700}
.settings .hrow{display:flex;align-items:center;justify-content:space-between}
.settings .hrow h3{margin:0}
.btn-clear{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:0.85rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
label.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:0.94rem;background:#fff}
label.opt input{width:18px;height:18px;margin:0;accent-color:var(--water)}
label.opt.on{border-color:var(--water);background:var(--water-soft)}
select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;font:inherit;font-size:1.067rem}
.rank{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center}
.rank.top{border-color:var(--water);box-shadow:0 0 0 2px var(--water-soft)}
.rank .n{font-weight:800;font-size:1.2rem}
.rank .n em{font-style:normal;font-weight:500;font-size:0.867rem;color:var(--muted);margin-left:6px}
.rank .why{font-size:0.867rem;color:var(--soft)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--water)}
.score{font-weight:600;color:var(--water)}
.steps{counter-reset:s}
.step{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 48px;margin-bottom:8px;position:relative;font-size:0.933rem}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:12px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--water);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.933rem}
.step .codes{font-weight:800;letter-spacing:.5px}
.step .h{color:var(--ink);font-size:0.867rem;margin-top:2px}
.note{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:8px;padding:9px 12px;font-size:0.9rem;line-height:1.45;margin:10px 0}
.info{background:var(--water-soft);border-left:4px solid var(--water);border-radius:8px;padding:9px 12px;font-size:0.9rem;line-height:1.45;margin:10px 0}
.empty{color:var(--soft);font-size:0.867rem;padding:12px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}

/* science */
details{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
summary{padding:11px 12px;font-weight:700;font-size:0.967rem;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"›";margin-left:auto;color:var(--muted);font-size:1.333rem;transition:transform .2s}
details[open] summary::after{transform:rotate(90deg)}
details .in{padding:0 12px 12px;font-size:0.933rem;line-height:1.5}
details .in p{margin:8px 0}
details .in b{font-weight:800;color:var(--water)}
.note b,.info b{font-weight:800}
details .in p:first-child{margin-top:4px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:0.867rem;margin:8px 0}
.three svg{width:100%;height:auto}
table{border-collapse:collapse;width:100%;font-size:0.867rem}
td,th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--bg);font-weight:600}

/* calculator */
.calc{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 12px}
.calc h4{margin:0 0 8px;font-size:1.0rem}
.calc .cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calc .col{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
.calc .col b{display:block;margin-bottom:6px}
.calc .flbl,.calc label{display:block;font-size:0.85rem;color:var(--soft);font-weight:600;margin-top:6px}
.calc input,.calc select{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit;font-size:1.067rem;background:#fff}
.calc .u{display:grid;grid-template-columns:1fr;gap:4px}
.calc .u.rate{grid-template-columns:1fr}
.calc .u select{padding:7px 4px}
.calc .presets{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.calc .presets button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 8px;font-size:0.85rem}
.calc .presets button.on{background:var(--water);color:#fff;border-color:var(--water)}
.calc>.flbl,.calc>label{display:block;font-size:0.85rem;color:var(--muted);margin-top:6px}
.calc>select{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit;background:#fff}
.calc .tank{margin-top:8px}
.calc .tank .flbl,.calc .tank label{display:inline-block;margin:0 8px 0 0}
.calc .tank input{width:90px}
.calc table{margin-top:10px;background:#fff}
.calc .verdict{margin-top:10px}
/* language picker */
#langPick{position:fixed;inset:0;background:var(--water);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:50;padding:24px}
#langPick.on{display:flex}
#langPick svg{width:110px;height:110px;margin-bottom:6px}
#langPick h1{margin:0;font-size:1.6rem}
#langPick button{width:min(280px,80vw);background:#fff;color:var(--water);border:0;border-radius:10px;padding:14px;font-size:1.2rem;font-weight:600}
#langPick .hint{opacity:.75;font-size:0.867rem;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
button:focus-visible,select:focus-visible{outline:3px solid var(--oil);outline-offset:2px}
</style>
</head>
<body>

<div id="langPick">
  <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M30 12h40v10h-6v8c10 6 16 17 16 30 0 20-14 32-30 32S20 80 20 60c0-13 6-24 16-30v-8h-6z" fill="#fff"/><path d="M28 60c0-11 5-20 12-25v-9h20v9c7 5 12 14 12 25 0 16-10 25-22 25S28 76 28 60z" fill="#dceef2"/><circle cx="42" cy="58" r="4" fill="#c98a1b"/><circle cx="56" cy="64" r="5" fill="#c98a1b"/><circle cx="48" cy="72" r="3" fill="#c98a1b"/><circle cx="60" cy="52" r="3" fill="#c98a1b"/></svg>
  <h1>FormuLab 剂型通</h1>
  <button onclick="setLang('zh',true)">中文</button>
  <button onclick="setLang('en',true)">English</button>
  <button onclick="setLang('ms',true)">Malay</button>
</div>

<header>
  <h1 id="title">剂型通</h1>
  <button id="sizeBtn" onclick="cycleSize()" aria-label="text size" style="background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:5px 9px;font-weight:600;min-width:44px">Aa</button>
  <button id="langBtn" onclick="cycleLang()">中文</button>
</header>

<main>
  <section id="v-lib" class="view on">
    <p class="lead" data-t="libLead"></p>
    <input id="libSearch" name="libSearch" type="search" placeholder="" aria-label="search" oninput="libQ=this.value;renderLib()" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:1.067rem;margin-bottom:8px;background:#fff">
    <div class="seg" id="libFilters" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px"></div>
    <div id="libList"></div>
  </section>

  <section id="v-pick" class="view">
    <p class="lead" data-t="pickLead"></p>
    <div class="settings">
      <h3 data-t="pickKind"></h3>
      <div id="kind"></div>
      <h3 style="margin-top:12px" data-t="pickPurpose"></h3>
      <div id="purpose"></div>
      <div id="purposeNote"></div>
      <h3 style="margin-top:12px" data-t="pickSprayer"></h3>
      <div id="sprayer"></div>
      <div id="sprayerNote"></div>
      <h3 style="margin-top:12px" data-t="pickAI"></h3>
      <div id="aiType"></div>
      <div class="hrow" style="margin-top:12px"><h3 data-t="pickPri"></h3><button class="btn-clear" data-t="clear" onclick="clearPri()"></button></div>
      <div class="grid2" id="priList"></div>
    </div>
    <div id="pickOut"></div>
  </section>

  <section id="v-mix" class="view">
    <p class="lead" data-t="mixLead"></p>
    <div class="settings">
      <h3 data-t="mixStage"></h3>
      <div id="stageSel"></div><div id="stageNote"></div>
      <h3 style="margin-top:12px" data-t="sprayerFrom"></h3>
      <div id="mixSprayer"></div><div id="mixSprayerNote"></div>
      <div class="hrow" style="margin-top:12px"><h3 data-t="mixWhat"></h3><button class="btn-clear" data-t="clear" onclick="clearMix()"></button></div>
      <div id="mixList"></div>
      <h3 style="margin-top:12px" data-t="mixActives"></h3>
      <div class="seg multi" id="actList" style="grid-template-columns:1fr 1fr"></div>
    </div>
    <div id="mixOut"></div>
  </section>

  <section id="v-sci" class="view">
    <p class="lead" data-t="sciLead"></p>
    <div id="sciList"></div>
  </section>
</main>

<nav>
  <button data-v="lib" class="on" onclick="show('lib')"><svg viewBox="0 0 24 24"><path d="M8 3h8v3h-2v3.2c2.4 1.1 4 3.5 4 6.3 0 3.6-2.7 6.5-6 6.5s-6-2.9-6-6.5c0-2.8 1.6-5.2 4-6.3V6H8z"/></svg><span data-t="navLib"></span></button>
  <button data-v="pick" onclick="show('pick')"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="12" height="3" rx="1.5"/><rect x="3" y="10.5" width="18" height="3" rx="1.5"/><rect x="3" y="16" width="8" height="3" rx="1.5"/></svg><span data-t="navPick"></span></button>
  <button data-v="mix" onclick="show('mix')"><svg viewBox="0 0 24 24"><path d="M4 4h16l-6 8v7l-4 2v-9z"/></svg><span data-t="navMix"></span></button>
  <button data-v="sci" onclick="show('sci')"><svg viewBox="0 0 24 24"><path d="M9 3h6v2h-1v5.5l5 8.5c.6 1-.1 2-1.2 2H6.2C5.1 21 4.4 20 5 19l5-8.5V5H9zm2 2v6.1l-2.6 4.4h7.2L13 11.1V5z"/></svg><span data-t="navSci"></span></button>
</nav>

<script>

const L = {

 mixOther:{cond:'标签写明先加的助剂（卵磷脂、脂肪醇醚类）',adj:'展着剂 / 粘着剂 / 渗透剂',dish:'洗洁精 — 不能用，点看原因',foliar:'叶面肥（钙、镁、螯合微量元素）',oil:'矿物油 / 植物油',humic:'增效剂（黄腐酸 / 腐植酸类）',faa:'发酵液肥（鱼氨基酸、酵素）',neem:'苦楝油（Neem）',orange:'橙油（d-柠檬烯）'},warnNeem:'苦楝油：冷榨苦楝油不会自己乳化——先在桶外用温水加乳化剂调匀，或买配好的苦楝油乳油。印楝素怕阳光和碱性水，傍晚喷，当天用完。用量 0.5–1%，只喷老叶，避开抽梢和开花。',warnOrange:'橙油是溶剂不是油脂：0.1–0.2% 当展着渗透剂很好，超过 0.5% 会洗掉叶面蜡层，嫩梢和花会灼伤，也会腐蚀旧喷雾器的橡胶件。',warnBoth:'<b>苦楝油和橙油不要同桶。</b>橙油是溶剂，会把苦楝油推进叶片，等于两份油加一份溶剂。隔周轮换喷：这周苦楝油对付介壳虫和螨，下周橙油击倒粉蚧和蚜虫。',botPair:{title:'{b}和桶里其他东西的冲突：',oil:'再加矿物油 / 植物油 → 两份油叠加，灼叶风险翻倍。二选一。',spread:'再加展着剂 / 渗透剂 / 洗洁精 → 植物油本身就是展着渗透剂，叠加只会流失和洗掉蜡层。去掉展着剂。',solv:'和 EC / ME / DC 同桶 → 农药自带溶剂和高量表面活性剂，加上植物油，嫩梢和花的药害风险很高。瓶试，减半用量，或分开喷。',od:'和 OD 同桶 → OD 已经是油基，再加油等于两份油。二选一。',cap:'和微囊类（CS、ZC、ZW、ZE）同桶 → 橙油是溶剂，会溶蚀囊壁，缓释变成一次释放。分开喷。',alk:'和碱性增效剂同桶 → 印楝素在碱性水里几小时内分解，等于白加。分开喷。',ca:'和含钙镁的叶面肥同桶 → 钙镁会破乳，油滴聚成油斑，落在叶上就是一个个灼伤点。瓶试，不稳就分开喷。'},warnBot:'苦楝油、橙油：<br>1. 冷榨苦楝油不会自己乳化——先在桶外用温水加乳化剂调匀，或买配好的苦楝油乳油。印楝素怕阳光和碱性水，傍晚喷，当天用完。<br>2. 橙油是溶剂不是油脂：0.1–0.2% 当展着渗透剂很好，超过 0.5% 会洗掉叶面蜡层，嫩梢和花会灼伤，也会腐蚀旧喷雾器的橡胶件。<br>3. 两者都算油：不与硫磺、百菌清、克菌丹同桶；不要再加其他油或展着剂——它们本身就是展着剂，加了只会流失和灼叶；避开正午高温。<br>4. 苦楝油和橙油也不要同桶：橙油是溶剂，会把苦楝油推进叶片，等于两份油加一份溶剂。隔周轮换喷。',warnFAA:'鱼氨基酸、酵素类发酵液肥：<br>1. 先用布过滤——鱼渣、鳞片、糖渣是堵喷头的头号原因。<br>2. 氨基酸会螯合金属，和铜制剂、代森锰锌同桶会削弱药效；它偏酸（pH 约 4），还会加重铜药害。<br>3. 桶里有杀菌剂就会杀死它的活菌，当纯营养用可以，想要活菌效果就分开喷。<br>用量按 1:500–1:1000，配好当天用完。',blockDish:'<b>把洗洁精拿出桶，软件才给配药顺序。</b>没有任何一种情况需要它。',warnDish:'<b>洗洁精不是展着剂。</b>它看起来有效——雾滴不再在叶面滚珠——所以这个习惯一直在；看不到的是两周后的代价。<br>1. 去油配方专门溶解油脂，叶面蜡层就是油脂：嫩梢幼果灼伤，老叶失去自己的防雨层几个星期。<br>2. 瓶里有什么不知道：香精、色素、抗菌剂、增稠盐，pH 从 7 到 10 都有，没有一样和农药测试过，有的会让悬浮剂絮凝。<br>3. 泡沫：半桶泡沫看不到水位，泵抽空气，最后三分之一喷的是空气。<br>4. 用量是猜的：一瓶盖在 16 升里可能是 0.05% 也可能是 0.5%。<br>农用非离子展着剂一桶几令吉，做同样看得见的事，没有看不见的代价。',warnHumic:'黄腐酸、腐植酸类对保护性接触药（代森锰锌、铜、百菌清）没有可靠增效证据；铜制剂可能反而减效。先查产品 pH：钾腐植酸多为碱性（pH 8–10），会分解代森锰锌和部分杀虫剂。一定瓶试。',
 jar:'混配前一定先做瓶试：按同样比例、同样顺序在透明瓶里配 1 升，静置 15 分钟。看到絮状、结块、油层、沉淀 → 不要混。',
 warnWPEC:'WP 遇 EC 的溶剂容易絮凝结块，务必瓶试。',warnFoliar:'含钙、镁的叶面肥会让悬浮剂絮凝，硬水也一样。先瓶试，或分开喷。',warnFoliarChel:'螯合微量元素（氨基酸、EDTA 类）会把铜制剂和代森锰锌里的金属抢走，降低药效。桶里有金属类杀菌剂就分开喷。',warnOD:'OD 与水分散粒剂混合时黏度高，要充分搅拌。',
 calc:{title:'两瓶比一比',packHint:'常见包装',wvHint:'标签写 25% w/v 就选 % w/v；写 w/w 的先用标签上的 g/L。',ta:'产品 A',tb:'产品 B',form:'形态',liq:'液体（g/L）',sol:'固体（%）',load:'含量',pack:'包装',price:'价格 RM',rate:'标签用量',ru:{tank:'每桶',per100:'每 100 L',ratio:'稀释倍数 1 :'},tank:'桶容量 L',ai:'每桶有效成分',measure:'每桶量取',cost:'每桶成本',perG:'每克有效成分',vFill:'填齐两个产品的数字后，结果在这里。用量必须来自标签，软件不给剂量。',vSame:'两个产品剂量相同。{c} 每克有效成分便宜 {p}%，是默认选择。',vDiff:'按标签用量，{a} 每桶比 {b} 多 {p}% 有效成分。两张标签的剂量不同，比价没有意义，先确认哪个剂量是对的。',inert:'{c} 每桶落到树上的制剂多 {p}%，油、溶剂、助剂也跟着多。',vEq:'两个产品剂量相同、每克价格也一样，按储存和量取方便选。'},
 sciLead:'看懂瓶子里发生什么，就懂为什么要摇、为什么会堵、为什么含量高不等于效果好。',
 sci:[
  ['什么是乳液？','<p><b>油和水不相溶。</b>倒一起会分成两层。用力摇，油会碎成小滴散在水里，但一停手，小滴又互相碰撞、合并，几分钟内重新分成两层。</p><p><b>乳液</b>就是让这些油滴留在水里不合并的状态。做到这一点靠<b>乳化剂</b>：一种一头亲水、一头亲油的分子。它们排在每颗油滴表面，亲油的一头插进油里，亲水的一头朝外，油滴之间就被隔开，碰到也合不起来。</p><p>你天天见到的乳液：<b>椰浆</b>（油滴散在水里，蛋白质当乳化剂）、牛奶、沙拉酱。椰浆放久了上面浮一层油，就是乳液在「乳析」，摇一摇又回去。</p><p><b>农药为什么需要乳液？</b>大多数有效成分是油溶性的，根本不溶于水。要让它均匀分散在一桶水里喷出去，只有两条路：把它溶在油里做成乳液（EC、EW、ME），或者把它磨成细粉做成悬浮液（SC、WP、WG）。</p><p><b>两种方向：</b>油滴在水里叫<b>水包油</b>（EW，兑水后能再稀释）；水滴在油里叫<b>油包水</b>（EO，稠、像黄油）。</p><p><b>油滴越细，乳液越稳定，也越透明。</b>粗油滴（几微米）是乳白色，静置会浮油；极细油滴（小于 0.1 微米）几乎透明，不会分层（ME）。</p>'],
  ['溶液 · 乳液 · 悬浮液：三种兑水后的状态','<div class="three">JAR3</div><p><b>溶液</b>：有效成分溶于水，透明。不会沉淀，也不需搅拌（SL、SP、SG）。</p><p><b>乳液</b>：有效成分溶在油滴里，油滴分散在水中，看起来像牛奶。油滴会往上浮（乳析），所以要摇（EC、EW、ME）。</p><p><b>悬浮液</b>：固体颗粒悬在水里，混浊。颗粒会往下沉，所以要持续搅拌（SC、WP、WG、CS）。</p><p>同一个有效成分，可以做成不同剂型。剂型改变的是<b>进入植物的方式和速度</b>，不是它杀菌杀虫的本领。</p>'],
  ['乳类家族一览：E 开头和 Z 开头的代码','<table><tr><th>代码</th><th>油在哪里</th><th>一句话</th></tr><tr><td>EC</td><td>溶剂里，兑水才乳化</td><td>经典乳油，溶剂最多</td></tr><tr><td>EW</td><td>已在水中的油滴</td><td>少溶剂的 EC</td></tr><tr><td>EO</td><td>油包着水</td><td>反过来的 EW，抗飘移</td></tr><tr><td>ME</td><td>极细油滴，透明</td><td>不需摇，渗透最快</td></tr><tr><td>SE</td><td>油滴 + 固体颗粒</td><td>SC 和 EW 装一瓶</td></tr><tr><td>EG / EP</td><td>吸在可溶颗粒或粉末上</td><td>没有液体溶剂的 EC</td></tr><tr><td>ES</td><td>同 EW，加染料</td><td>拌种用</td></tr><tr><td>DC</td><td>溶剂与水互溶</td><td>兑水析出细颗粒</td></tr><tr><td>CS</td><td>包在微囊里</td><td>缓释，最安全</td></tr><tr><td>ZC</td><td>微囊 + 固体颗粒</td><td>CS + SC</td></tr><tr><td>ZW</td><td>微囊 + 油滴</td><td>CS + EW</td></tr><tr><td>ZE</td><td>微囊 + 油滴 + 颗粒</td><td>CS + SE，三相</td></tr><tr><td>OL / OF / UL</td><td>油是稀释液</td><td>不加水，烟雾机或超低容量</td></tr></table><p>Z 开头的意思：把速效相和缓释相装进同一瓶。速效相（固体或油滴）负责击倒，微囊负责后面两三周。代价是储存更娇气、价格更高。</p>'],
  ['表面活性剂：润湿、分散、乳化三个角色','<p>剂型里的「助剂」不是填料，每一种有工作：</p><p><b>润湿剂</b>让粉末和水亲近，粉才能沉下去而不是浮在水面结团。</p><p><b>分散剂</b>包住每一个颗粒，让颗粒互相排斥，不结块。</p><p><b>乳化剂</b>站在油和水的界面上，让油能碎成细滴留在水里。</p><p>硬水里的钙镁离子会「抢走」这些助剂，所以硬水会让乳液破乳、悬浮剂沉淀。</p>'],
  ['瓶子为什么会坏：五种失效','BOTTLE<table><tr><th>现象</th><th>发生在</th><th>原因</th><th>怎么办</th></tr><tr><td>上面一层油</td><td>EW、ME</td><td>油滴浮起、合并（乳析）</td><td>用力摇匀，摇匀后仍有油层 → 已破乳，丢弃</td></tr><tr><td>底部沉淀，能摇散</td><td>SC、SE、OD</td><td>颗粒下沉（沉降）</td><td>正常，使用前摇匀</td></tr><tr><td>底部硬块，摇不散</td><td>SC、OD</td><td>沉淀压实（硬结块）</td><td>丢弃。硬块进喷雾器会堵喷头</td></tr><tr><td>粗砂感，颗粒变大</td><td>SC</td><td>小颗粒溶解后再长到大颗粒上（晶体生长）</td><td>丢弃。大颗粒效果差又堵喷头</td></tr><tr><td>变稠、变胶</td><td>SC、OD</td><td>高温下增稠剂或分散剂失效</td><td>加水稀释仍不散 → 丢弃</td></tr></table><p>规律：<b>水基液体剂型怕热</b>，干剂型（WP、WG）最耐放。马来西亚仓库常超过 35°C，液体最好一季用完。</p>'],
  ['沉降快慢：颗粒大小和密度','<p>颗粒越大、越重，沉得越快（斯托克斯定律：沉降速度与颗粒直径的平方成正比）。颗粒直径加倍，沉降快四倍。</p><p>这就是为什么：</p><p>· 优质 SC 研磨到 1–3 微米，几天才见底；便宜的 SC 几小时就分层。</p><p>· WP 颗粒比 SC 粗得多（5–20 微米），所以喷 WP 时搅拌不能停。</p><p>· 增稠剂是让水「变稠」来拖慢沉降，不是让颗粒变轻。</p>'],
  ['瓶试怎么做','<p>1. 拿透明瓶，装 1 升你要用的水（同一水源）。</p><p>2. 按比例、按加入顺序加每种产品，每加一种摇 10 秒。</p><p>3. 静置 15 分钟。</p><p>4. 合格：均匀混浊或均匀乳白，摇一摇能恢复。</p><p>5. 不合格：絮状物、结块、油层、油珠、块状沉淀、变色发热。</p><p>6. 不合格就分开喷，不要硬混。</p>'],
  ['含量高 ≠ 效果好：按每英亩有效成分计算','CALC<p>标签上的 250 g/L、430 g/L 是瓶子里的浓度，不是田里的剂量。</p><p>田里的剂量是 <b>每英亩或每桶多少克有效成分</b>。250 g/L 的产品用 1 升，和 430 g/L 的产品用 0.58 升，落到树上的有效成分一样多。</p><p>含量高只影响运费、包装和量取，不影响药效。比较产品要比：<b>相同有效成分剂量下</b>，哪个剂型吸收快、持效长、更安全、更耐放。</p>'],
  ['水质：硬度、pH、温度','<p><b>硬水</b>（雨水以外的井水、山水常见）：钙镁离子破坏乳化和分散，加水前先用软水剂或选用耐硬水产品。</p><p><b>pH</b>：多数农药在微酸（5.5–6.5）最稳定，碱性水（pH>8）会让部分成分几小时内分解。</p><p><b>温度</b>：热水（>30°C）让乳液更容易破乳，也加速分解。用常温水。</p>'],
  ['非内吸药怎么用得更好：覆盖、粘着、时机','<p>先纠正一点：内不内吸是<b>有效成分</b>的事，不是剂型。代森锰锌做成 EW 还是保护性接触药。药不会走，所以效果只取决于三件事：落在哪里、留多久、孢子来时它还在不在。</p><p><b>1. 覆盖，最大的杠杆。</b>保护药只保护它碰到的那几平方毫米。叶背、果柄、枝杈漏了，病菌就从那里进。做法：喷到叶面发亮就停，不要喷到流；用空心锥喷头打细雾；树冠两面都喷；走慢一点。榴莲修剪让雾能打进树冠，本身就是保护药的增效手段。</p><p><b>2. 助剂，每种解决一个具体问题：</b></p><table><tr><th>问题</th><th>助剂</th><th>注意</th></tr><tr><td>雾滴在蜡质叶面上滚成珠</td><td>展着剂 / 润湿剂（非离子表面活性剂）</td><td>有机硅「超级展着剂」能铺满整片叶，但也容易直接流掉，还会把药推进气孔——嫩梢幼果容易药害</td></tr><tr><td>雨一冲就没</td><td>粘着剂（乳胶、松烯、树脂类）或展着粘着剂</td><td>粘太牢，露水就带不动药膜再分布</td></tr><tr><td>高温下药膜干得斑斑点点</td><td>保湿剂（甘油类）</td><td>影响小</td></tr><tr><td>硬水、pH 不对</td><td>水质调理剂、酸化剂 / 缓冲剂</td><td>铜和代森锰锌在碱性水里都会失效，先查 pH 再谈别的</td></tr></table><p><b>3. 时机，保护药必须先到。</b>在诱发感染的那场雨之前喷，不是之后。约 25 毫米雨后或两到三周后补喷，哪个先到算哪个。这是最便宜的增效，也是最多人做错的一步。</p><p><b>4. 在保护药里选剂型。</b>颗粒细的 SC 或 WG（1–3 微米）每克盖的面积比粗 WP 大，也更容易随露水再分布；CS 能把间隔拉长。铜和代森锰锌其实靠小雨和露水在叶面上再分布，所以粘着剂用适量，不要用重的。</p><p><b>5. 和内吸药搭配。</b>多作用位点的保护药加单作用位点的内吸药，不只是效果相加：保护药补内吸药漏掉的面，混用又拖慢内吸药的抗性。标准搭配就是这么来的。</p><p><b>助剂做不到的事：</b>把非内吸药变成内吸药。渗透剂能把某些成分推进叶片一点点（跨层），但铜这类真正的接触药加什么都留在表面。要药进到组织里，换分子，不是换助剂。</p>'],
  ['助剂小词典：软件里这些词是什么意思','<table><tr><th>词</th><th>是什么</th><th>什么时候用</th></tr><tr><td>表面活性剂</td><td>一头亲水一头亲油的分子，所有展着、乳化、分散的基础</td><td>—</td></tr><tr><td>非离子</td><td>头部不带电的表面活性剂（脂肪醇醚、有机硅、聚山梨酯）。不和硬水的钙镁反应，不絮凝悬浮剂，泡沫少，酸碱都能用</td><td>标签说「加展着剂」时指的就是它</td></tr><tr><td>阴离子</td><td>头部带负电（硫酸盐、磺酸盐）。洗洁精、洗衣粉。泡沫多，遇硬水沉淀</td><td>不进农药桶</td></tr><tr><td>展着剂 / 润湿剂</td><td>降低表面张力，让药液在蜡质叶面铺成膜而不是滚珠</td><td>药液滚珠时；抽梢期不加</td></tr><tr><td>渗透剂</td><td>把药推过蜡层进叶片。有机硅「超级展着剂」是最强的一种</td><td>内吸药、治疗喷雾；保护药不需要；嫩叶不用</td></tr><tr><td>粘着剂</td><td>乳胶、松烯、树脂类，把药膜粘在叶面，耐雨</td><td>雨前；铜和代森锰锌用适量，太牢露水带不动再分布</td></tr><tr><td>矿物油 / COC</td><td>石蜡油加乳化剂，最温和的油类助剂，窒息介壳虫和螨</td><td>老叶，0.5–1%；一桶只能有一份油</td></tr><tr><td>MSO 甲酯化植物油</td><td>植物油做成甲酯（和生物柴油同一反应），比生油更稀、更渗透</td><td>除草剂标签常指定；对作物最不温和，嫩叶远离</td></tr><tr><td>苦楝油 / 橙油</td><td>见混配顺序的提醒</td><td>各自单独用，隔周轮换</td></tr><tr><td>水质调理剂</td><td>硫酸铵、酸化剂、缓冲剂，处理硬水和 pH</td><td>标签或水质需要时，先加</td></tr><tr><td>飞防助剂</td><td>抗飘移加抗蒸发，为每英亩 10–15 L 水设计，常含低比例甲酯化油</td><td>无人机专用，按它自己的用量；不能用地面油类代替</td></tr></table>'],
  ['无人机：药量不变，换载体','<p>地面喷雾一英亩用约 300 L 水，无人机只带 10–15 L。<b>树需要的有效成分一克都没变</b>，变的只是水少了 25 倍——所以同样的药量在桶里浓了 25 倍。</p><p><b>为什么不能减药量：</b>减了就是欠量，防效差，杀菌剂还会筛选出抗性。飞防「省药 20–30%」是少了地面浪费的说法，不是给树少喂的理由；标签没写飞防用量，就按每英亩原量。</p><p><b>「载体」是什么：</b>桶里除了有效成分以外的一切——水、溶剂、乳化剂、表面活性剂、油、助剂。地面喷雾载体几乎全是水；无人机水少了，其他部分就突出出来，这才是灼叶的来源。</p><p><b>换载体，四件事：</b></p><p>1. 换剂型：同一有效成分，换载体不同的类型。EC（溶剂+乳化剂）换 SC（水+分散剂）或 OD（专为低容量设计的轻油）。WP 换 WG 或 SC。</p><p>2. 换助剂：地面展着剂和农场用油全部拿掉，换标签写明飞防用的抗飘移、抗蒸发助剂，按它自己的用量。</p><p>3. 接受无人机的水量：10–15 L 就是它带的量，不要为了「多点水」飞两遍。</p><p>4. 换时机：落到叶上时载体最浓，避开抽梢、开花和正午。</p><p><b>榴莲的例子：</b>地面每英亩喷 400 ml 的 250 EW（100 g 有效成分）在 300 L 水里。错的换法：400 ml 倒进 12 L。对的换法：同样 100 g 有效成分 = 230 ml 的 430 SC，在 12 L 水里加飞防助剂，清晨喷老叶。有效成分没动，动的是载体。</p><p>每英亩换算要按有效成分核对，不是按毫升，用「两瓶比一比」。</p><p><b>公顷换英亩：</b>标签写每公顷的，除以 2.471。例如 600 ml/公顷 = 243 ml/英亩；20 L/公顷 = 8.1 L/英亩。药量和水量都除同一个数，桶内浓度不变。</p>'],
  ['无人机配药：每箱加多少','DCALC']
 ]},
en:{search:'Search code or name, e.g. EW, suspension',kDrone:'Drone',droneL:['avoid','caution','works','made for it'],droneWhy:{OD:'oil phase carries built-in anti-evaporation and spreading; the drone formulation of choice in China',UL:'purpose-built ULV, neat or oil-diluted',OF:'purpose-built ULV',SC:'fine particles, water-based, no solvent; the most common drone fungicide type; keep agitating',ME:'already dissolved, sub-micron droplets, clear and stable, nothing to block',EW:'already dissolved, fine droplets, nothing to block',SL:'true solution, nothing blocks or settles; but with little enough water the active can pass its solubility limit and crystallise, especially with fertiliser in the tank',EC:'usable, but ground spraying uses about 300 L of water per acre and a drone about 12 L, so the same dose is roughly 25 times as concentrated in the tank; without a drone rate on the label, do not convert one',WG:'only if fully dispersed in a bucket first and the product is fine-milled',WP:'coarse particles abrade pumps and block fine nozzles',CS:'high-pressure pumps may break capsule walls, turning slow release into one dump, unless the label or maker gives a drone rate',ZC:'contains capsules, as CS',ZE:'contains capsules, as CS'},droneSL:'SL in a drone tank: watch the solubility limit. Less water means higher concentration, and past what the active can dissolve you get crystals or salting out, clear in the tank but blocking nozzles in the air. Foliar feeds and other salts make it worse. Jar test at the real drone concentration.',droneSolid:'{list} in a drone tank carries ten to twenty times the solid load of a ground spray: incomplete dispersion, settling, blocked filters and nozzles, deposits in hoses. Disperse fully in a bucket before loading, agitate throughout, rinse the filter after every tank.',droneAdjRate:'<b>Check the unit on the adjuvant label.</b> A percentage (0.05–0.1%) and an amount per acre are not interchangeable: 0.1% in 500 L/ha on the ground is 500 ml/ha; the same 0.1% in a drone at 20 L/ha is only 20 ml/ha, effectively nothing; forcing 500 ml/ha into 20 L makes a 2.5% organosilicone solution, which scorches. Read which unit the label gives and follow the drone figure.',droneCanopy:'A durian canopy is tall and layered: a drone spraying from above covers the top well and often leaves the middle, lower and inner canopy short. Trunk and root disease are not solved by a canopy drone pass; trunk painting and soil drenching still have to be done.',droneLabel:'<b>Malaysia: a pesticide may only be loaded into a drone if it is registered with the Pesticides Board (LRMP) and its label carries a recommendation for UAS use.</b> This app explains formulation science and arithmetic; it does not replace the label. Check the label or SISMARP for drone approval.',dcal:{title:'Drone mix calculator',unit:'Area unit',unitL:['acre','hectare'],rate:'Label rate per {u}',vol:'Spray volume per {u} L',tank:'Drone tank L',flow:'Flow L/min',speed:'Speed km/h',swath:'Effective swath m',calib:'Do not know the spray volume? Work it out from flow, speed and swath',calibOut:'About {v} L/{u}',useIt:'Use this figure',perTank:'Product per tank',covers:'One tank covers',conc:'Tank concentration',jarTitle:'Jar test recipe (make 1 litre)',jarNote:'Mix these amounts into 1 litre in a clear bottle and stand it 15–30 minutes. Sediment, flakes, crystals, an oil layer, a cream layer, gel or sludge → do not mix. A jar test at ground dilution does not count.',fill:'Enter the label rate and the spray volume',warnLow:'Below 4 L/acre (about 10 L/ha) deposition gets worse. Contact protectants and contact insecticides especially need more water. That is one trial\'s result, a starting point rather than a rule.',covNote:'Decide the coverage you need first, then the spray volume; not the lowest the drone can fly. Systemics can take less, contact and protectant products need more.',drop:'Droplets: medium to coarse, around 250–320 µm, is a common starting point. Too fine drifts and evaporates; too coarse gives fewer droplets and poorer coverage. Adjust on what you actually deposit.'},grpNames:{emu:'Emulsions: oil droplets in water',sus:'Suspensions: solid particles in water',cap:'Capsule types: active sealed in capsules',sol:'Solutions: fully dissolved in water',ulv:'Oil-diluted / ULV: no water',dry:'Applied dry: no water'},backTo:'Back to the {c} card',cmp:{btn:'Compare',btnOn:'Selected',pick1:'{a} selected, tap Compare on another type',title:'{a} vs {b}',clear:'Cancel',toPrice:'Compare two bottles by price →',rowDilute:'In the tank',rowAgit:'Agitation',rowDrone:'Drone',rowAvail:'On Malaysian shelves',rowStore:'Storage',rowSafe:'Safety',better:'better',same:'same',note:'●●● best, ○○○ worst. Green cell is the better side of that row. Scores are informed judgement.'},about:{title:'Share and credits',share:'Scan to open this app, or share it with other farmers',link:'stanleywoosweeleong.github.io/emulsiontypes',copy:'Copy link',copied:'Copied',send:'Share to WhatsApp',credit:'Taking the inspiration from the generous sharing by Dr. Lim Ing Keat on various emulsion types.'},kAvail:'On Malaysian shelves',availL:['almost never','uncommon','available','common'],rare:'uncommon',
 pickKind:'Product type',kinds:['Fungicide','Insecticide'],

 purposeNoteI:{1:'Knockdown needs the active to contact the insect fast; dissolved forms (EC, EW, ME) spread and penetrate quickest. Ticked: fast uptake.',2:'Residual relies on a deposit that stays on the leaf; particle and capsule types last longest. Ticked: long protective deposit.',3:'Sap-suckers (aphids, mealybugs, psyllids) need the active in the plant sap; only a systemic active can do that, the formulation only sets how fast it gets in. Ticked: fast uptake.'},

 oilCarriers:{EC:'EC',ME:'ME',DC:'DC',OD:'OD',EO:'EO',oil:'mineral / vegetable oil'},warnOilStack:'<b>{n} oil or solvent carriers in one tank: {list}. One per tank.</b><br>It is not the oil that burns but three things riding with it: EC solvent dissolves cuticle wax the moment it lands; each product\'s own emulsifier package stacks up and pushes the spray through into the cells; a thicker oil film blocks stomata and the afternoon sun cooks the leaf.<br>Flush, flowers and fruit below golf-ball size go first; hardened leaves tolerate it, which is why the same mix is harmless one week and destroys a flush the next.<br>A jar test shows whether the mix stays mixed, not whether it burns. During flush or flowering do not test it, spray separately.',qty:'products',warnDupSolv:'{n} {c} products in one tank: solvent and emulsifier stack up, so scorch risk on flush, young fruit and flowers rises sharply; the two emulsifier systems can also interfere and one product creams out. Jar test, avoid midday, spray separately if you can.',warnDupSusp:'{n} {c} products in one tank: double the particle load, dispersants compete, so flocculation, settling and blocked nozzles are more likely. Agitate harder and jar test.',warnDupOther:'{n} {c} products in one tank: same type is no guarantee of compatibility. Jar test.',warnEmuAdj:'{c} already carries its own emulsifier, which is a surfactant doing the spreading and penetrating. A spreader or penetrant on top mostly buys run-off and more uptake into the leaf; with ME never. Look at the leaf first: if after a few strokes the spray sits as round droplets instead of spreading into a film, that is beading, coverage is poor, and only then add a non-ionic wetter at the low end of its label rate; if the leaf is already filmed, do not. In flush, no wetter regardless of how the old leaves look: new leaves have no wax layer yet, a wetter\'s job is to get through wax, and with no wax it pushes the product straight into tender tissue, which is where scorch and distorted leaves come from. A sticker is fine.',warnSLEmu:'SL with {c} in one tank: many SLs are salts (amine or potassium salts), and a high electrolyte load breaks an emulsion the same way hard water does, oil gathering into a layer. Keep the order the app gives, emulsion in before SL, and if the jar test shows an oil layer, spray separately. SL itself has no oil; the oil slot is already taken by {c}, so no oil adjuvant.',warnMany:'More than three products in one tank multiplies compatibility risk. Do not skip the jar test.',

 pickPurpose:'What is this spray for?',purpose:['Skip','Prevent: disease not yet present (P)','Treat: disease just appearing (C)','Eradicate: lesions established (E)'],purposeNote:{1:'Prevention relies on a deposit that stays on the leaf. S, P, C, E belong to the active ingredient; no formulation changes them, it only decides how much of each you collect. Ticked: long protective deposit. A protectant is enhanced by coverage, retention and timing; see Science.',2:'Treatment needs the active inside the leaf, so only a systemic (S) active can treat. A formulation cannot make a non-systemic active systemic, but dissolved forms (EC, EW, ME) get in faster than solid particles. Ticked: fast uptake.',3:'Eradication needs a systemic (S) active, penetration into existing lesions, and a full dose. Formulation is one lever, but whether an active can eradicate at all is set by the molecule. Ticked: fast uptake and rainfastness.'},

 mixWhat:'What is going in the tank?',mixStage:'State of the tree right now',stages:['Normal','In flush','Flowering or small fruit'],stageNote:{1:'Flush: new leaves have no wax layer yet, so oil, solvent and spreader burn risk is at its highest.',2:'Flowering or small fruit: flowers and small fruit drop the moment they scorch. Do not mix oils or ECs at this stage; spray separately.'},stageEsc:'<b>The tree is {s}: the warning above is not \'be careful\', it is \'spray separately\'.</b> Do not gamble on a jar test; wait until the flush hardens or fruit set is stable before mixing.',droneOil:'<b>These oils cannot go in a drone tank: {list}.</b> Ground oil relies on 300–400 L of water to spread 0.5–1% oil thin; a drone carries 10–15 L per acre, so the same percentage is 15–30 times less oil and does nothing, and the same oil per acre makes a 15–30% oil tank that no emulsifier holds, lands as near-neat oil, burns, and gums pumps and nozzles. Drones use only anti-drift and anti-evaporation adjuvants whose label names drone use.',droneCap:'<b>Check before putting capsule types in a drone ({list}).</b> Drone pumps run at high pressure and shear and may break the capsule walls, turning slow release into one dump: you pay for capsules and spray an ordinary product. Some capsule products are built to take the shear; use one only if the label or the maker gives a drone rate. If nobody can say, use SC or EW.',droneWP:'<b>WP cannot go in a drone.</b> Coarse particles, fine nozzles, certain blockage. Use SC or WG (confirm it is fully dispersed before loading).',droneEC:'EC in a drone tank: ground spraying uses about 300 L of water per acre, a drone about 12 L, so the same dose is roughly 25 times as concentrated, solvent included. Not during flush or flowering; otherwise use the label\'s drone rate, and if the label has no drone rate, do not convert one yourself.',droneNote:'<b>Do not cut the dose for a drone.</b> Active per acre stays the same as ground spraying; only the water is less. What changes is the carrier: EC to SC or OD, ground spreaders and oils to a drone adjuvant, and keep off flush and flowers. Rates are per acre, not per tank. See Choose or the Drone row on each type card for suitable types; How much per tank: use Drone tank in Science. Details in the last Science section.',sprayerFrom:'Sprayer',grpPest:'Pesticides',grpAdj:'Adjuvants · feeds · oils',version:'Version',
 mixNone:'Tick the formulations you want to mix.',
 warnCap:'Capsule products (CS, ZC, ZW, ZE) dislike hard shearing: use low pump pressure, avoid long bypass recirculation, rinse promptly after spraying.',mixSteps:{cond:'This kind of adjuvant goes in first; agitate until fully dissolved before any pesticide. Follow the label order',fill:'Fill the tank half full with water, start agitation',dry:'Dry products first. Let each disperse fully before the next',flow:'Then water-based suspensions. Never pour onto a floating powder lump',emul:'Then oil-based emulsions. Their solvent stabilises what is already in',sol:'Then water-soluble liquids',adj:'Adjuvants, foliar fertilisers and penetrants last',top:'Top up with water while agitating. Spray the same day, never leave overnight'},
 mixOther:{cond:'Adjuvant whose label says add first (lecithin, fatty alcohol ethoxylate type)',adj:'Spreader / sticker / penetrant',dish:'Dishwashing liquid — never; tap for why',foliar:'Foliar fertiliser (Ca, Mg, chelated micronutrients)',oil:'Mineral or vegetable oil',humic:'Enhancer (fulvic / humic acid type)',faa:'Fermented liquid feed (fish amino acid, eco-enzyme)',neem:'Neem oil',orange:'Orange oil (d-limonene)'},warnNeem:'Neem oil: cold-pressed neem does not emulsify by itself; pre-mix in a bucket of warm water with an emulsifier before the tank, or buy a formulated neem EC. Azadirachtin breaks down in sunlight and alkaline water: spray late afternoon, finish the tank the same day. Use at 0.5–1%, hardened leaves only, avoid flush and flowering.',warnOrange:'Orange oil is a solvent, not a fat: 0.1–0.2% is a good wetter-penetrant; above about 0.5% it strips leaf wax, burns flush and flowers, and attacks rubber seals in older sprayers.',warnBoth:'<b>Do not put neem and orange oil in the same tank.</b> Orange oil is a solvent and drives the neem into the leaf: two oils plus a solvent. Alternate week by week: neem this week for scale and mites, orange oil next week to knock down mealybug and aphids.',botPair:{title:'{b} clashes with what else is in the tank:',oil:'plus mineral or vegetable oil → two oils stacked, double the scorch risk. Pick one.',spread:'plus spreader / penetrant / dishwashing liquid → the botanical oil already is the spreader-penetrant; stacking only means run-off and stripped wax. Drop the spreader.',solv:'with EC / ME / DC → the pesticide already carries solvent and heavy surfactant; add botanical oil and flush and flowers are at high risk. Jar test, halve the rate, or spray separately.',od:'with OD → OD is already oil-based, adding oil makes two oils. Pick one.',cap:'with capsule types (CS, ZC, ZW, ZE) → orange oil is a solvent and dissolves capsule walls, turning slow release into one dump. Spray separately.',alk:'with an alkaline enhancer → azadirachtin breaks down in alkaline water within hours, so it is wasted. Spray separately.',ca:'with a Ca/Mg foliar feed → calcium and magnesium break the emulsion, oil gathers into blobs, and each blob on a leaf is a scorch spot. Jar test; if it separates, spray separately.'},warnBot:'Neem oil and orange oil:<br>1. Cold-pressed neem does not emulsify by itself: pre-mix it in a bucket of warm water with an emulsifier before the tank, or buy a formulated neem EC. Azadirachtin breaks down in sunlight and alkaline water: spray late afternoon, finish the tank the same day.<br>2. Orange oil is a solvent, not a fat: 0.1–0.2% is a good wetter-penetrant, above about 0.5% it strips leaf wax, burns flush and flowers, and attacks rubber seals in older sprayers.<br>3. Both count as oil: not with sulphur, chlorothalonil or captan; add no other oil or spreader on top, they are the spreader and more only means run-off and scorch; avoid midday heat.<br>4. Do not put neem and orange oil in the same tank either: orange oil is a solvent and drives the neem into the leaf, two oils plus a solvent. Alternate them week by week.',warnFAA:'Fish amino acid and eco-enzyme ferments:<br>1. Strain through cloth first: fish solids, scale and sugar residue are the number-one nozzle blocker.<br>2. Amino acids chelate metals; in a tank with copper or mancozeb they weaken the fungicide, and the ferment is acidic (about pH 4), which also increases copper phytotoxicity.<br>3. Any fungicide in the tank kills its live microbes; fine as pure nutrition, spray separately if you want the microbial effect.<br>Use at 1:500 to 1:1000 and finish the tank the same day.',blockDish:'<b>Take the dishwashing liquid out of the tank and the mix order will appear.</b> There is no situation that needs it.',warnDish:'<b>Dishwashing liquid is not a spreader.</b> It looks like it works, the droplets stop beading on the leaf, which is why the habit persists; what you do not see is the cost two weeks later.<br>1. Degreasers dissolve fat, and leaf cuticle is wax: flush and young fruit scorch, and mature leaves lose their own rain barrier for weeks.<br>2. Unknown contents: fragrance, dye, antibacterial agents, thickening salt, pH anywhere from 7 to 10; none tested with pesticides, some flocculate SCs.<br>3. Foam: half a tank of suds hides the water level, the pump cavitates, the last third sprays air.<br>4. The dose is a guess: a capful in 16 L could be 0.05% or 0.5%.<br>An agricultural non-ionic spreader costs a few ringgit a tank and does the same visible job without the invisible cost.',warnHumic:'Fulvic and humic products have no reliable evidence of enhancing contact protectants (mancozeb, copper, chlorothalonil); with copper they can reduce activity. Check the product pH first: potassium humates are usually alkaline (pH 8–10) and break down mancozeb and some insecticides. Always jar test.',
 jar:'Always jar-test first: same water, same ratio, same order, 1 litre in a clear bottle, stand 15 minutes. Flocs, lumps, oil layer or sediment → do not mix.',
 warnWPEC:'WP tends to flocculate when EC solvent is added. Jar test is essential.',warnFoliar:'Calcium and magnesium foliar feeds can flocculate suspensions; hard water does the same. Jar test or spray separately.',warnFoliarChel:'Chelated micronutrients (amino-acid or EDTA types) pull the metal out of copper fungicides and mancozeb and weaken them. If a metal fungicide is in the tank, spray separately.',warnOD:'OD mixed with water-dispersible granules gets viscous. Agitate well.',

 sciLead:'Understand what happens in the bottle and you understand why you shake, why nozzles block, and why higher loading is not better efficacy.',
 sci:[
  ['What is an emulsion?','<p><b>Oil and water do not mix.</b> Pour them together and they separate into two layers. Shake hard and the oil breaks into small droplets in the water, but the moment you stop, the droplets collide, merge, and within minutes there are two layers again.</p><p>An <b>emulsion</b> is the state where those oil droplets stay in the water and do not merge. What makes that possible is an <b>emulsifier</b>: a molecule with a water-loving head and an oil-loving tail. Emulsifiers line up on the surface of every droplet, tail in the oil, head facing out, so droplets are kept apart and cannot fuse when they touch.</p><p>Emulsions you already know: <b>santan</b> (oil droplets in water, held by coconut protein), milk, mayonnaise. The oil layer that floats on santan left standing is the emulsion creaming; a shake puts it back.</p><p><b>Why pesticides need emulsions:</b> most actives are oil-soluble and will not dissolve in water at all. To spread one evenly through a tank of water there are only two routes: dissolve it in oil and emulsify (EC, EW, ME), or mill it to fine powder and suspend it (SC, WP, WG).</p><p><b>Two directions:</b> oil droplets in water is <b>oil-in-water</b> (EW; dilutes further with water). Water droplets in oil is <b>water-in-oil</b> (EO; thick, like butter).</p><p><b>Finer droplets mean a more stable and more transparent emulsion.</b> Coarse droplets of a few microns look milky and cream on standing; ultra-fine droplets under 0.1 µm are almost clear and never separate (ME).</p>'],
  ['Solution, emulsion, suspension: three things water can hold','<div class="three">JAR3</div><p><b>Solution</b>: the active dissolves in water. Clear. Nothing settles, no agitation needed (SL, SP, SG).</p><p><b>Emulsion</b>: the active is dissolved in oil droplets, and the droplets float in water. Looks like milk. Droplets rise (creaming), so you shake (EC, EW, ME).</p><p><b>Suspension</b>: solid particles hang in water. Cloudy. Particles sink, so you keep agitating (SC, WP, WG, CS).</p><p>The same active can be made into different types. The type changes <b>how and how fast it enters the plant</b>, not its ability to kill the pest.</p>'],
  ['The emulsion family at a glance: E codes and Z codes','<table><tr><th>Code</th><th>Where the oil is</th><th>In one line</th></tr><tr><td>EC</td><td>In solvent; emulsifies only on dilution</td><td>Classic, most solvent</td></tr><tr><td>EW</td><td>Oil droplets already in water</td><td>EC with less solvent</td></tr><tr><td>EO</td><td>Oil wraps the water</td><td>EW inside-out, anti-drift</td></tr><tr><td>ME</td><td>Ultra-fine droplets, clear</td><td>No shaking, fastest penetration</td></tr><tr><td>SE</td><td>Oil droplets plus solid particles</td><td>SC and EW in one bottle</td></tr><tr><td>EG / EP</td><td>Held on soluble granule or powder</td><td>EC without liquid solvent</td></tr><tr><td>ES</td><td>As EW, with dye</td><td>Seed dressing</td></tr><tr><td>DC</td><td>Solvent mixes with water</td><td>Fine particles form on dilution</td></tr><tr><td>CS</td><td>Sealed in capsules</td><td>Slow release, safest</td></tr><tr><td>ZC</td><td>Capsules plus solid particles</td><td>CS + SC</td></tr><tr><td>ZW</td><td>Capsules plus oil droplets</td><td>CS + EW</td></tr><tr><td>ZE</td><td>Capsules, droplets and particles</td><td>CS + SE, three phases</td></tr><tr><td>OL / OF / UL</td><td>Oil is the diluent</td><td>No water: foggers or ULV</td></tr></table><p>What Z means: a fast phase and a slow phase in one bottle. The fast phase (solid or oil droplet) knocks down; the capsules cover the following two or three weeks. The price is fragile storage and a higher cost.</p>'],
  ['Surfactants: wetter, dispersant, emulsifier','<p>The "inerts" are not filler. Each has a job:</p><p><b>Wetter</b> makes powder and water friendly, so powder sinks instead of floating in a crust.</p><p><b>Dispersant</b> coats every particle so particles repel each other and do not clump.</p><p><b>Emulsifier</b> sits on the oil-water boundary so oil can break into fine droplets and stay in the water.</p><p>Calcium and magnesium in hard water steal these surfactants, which is why hard water breaks emulsions and settles suspensions.</p>'],
  ['Why the bottle fails: five failure modes','BOTTLE<table><tr><th>What you see</th><th>Types</th><th>Cause</th><th>Action</th></tr><tr><td>Oil layer on top</td><td>EW, ME</td><td>Droplets rise and merge (creaming, coalescence)</td><td>Shake hard. If the layer stays → emulsion broken, discard</td></tr><tr><td>Sediment that shakes back in</td><td>SC, SE, OD</td><td>Particles sinking (sedimentation)</td><td>Normal. Shake before use</td></tr><tr><td>Hard layer that will not shake up</td><td>SC, OD</td><td>Compacted sediment (caking)</td><td>Discard. It blocks nozzles</td></tr><tr><td>Gritty, larger particles</td><td>SC</td><td>Small particles dissolve and regrow onto big ones (crystal growth)</td><td>Discard. Big particles work worse and block nozzles</td></tr><tr><td>Thickened, gel-like</td><td>SC, OD</td><td>Thickener or dispersant failed in heat</td><td>If it will not thin with water → discard</td></tr></table><p>Pattern: <b>water-based liquids hate heat</b>; dry types (WP, WG) keep best. Malaysian sheds often exceed 35°C, so use liquids within a season.</p>'],
  ['How fast things settle: size and density','<p>Bigger, heavier particles sink faster. Stokes\' law: settling speed rises with the square of particle diameter. Double the diameter, four times the speed.</p><p>So:</p><p>· A good SC is milled to 1–3 µm and takes days to settle; a cheap one separates in hours.</p><p>· WP particles are much coarser (5–20 µm), which is why agitation must never stop when spraying WP.</p><p>· Thickeners slow settling by making the water "thicker", not by making particles lighter.</p>'],
  ['How to jar test','<p>1. Clear bottle, 1 litre of the water you will actually use.</p><p>2. Add each product at the field ratio, in the tank order, shaking 10 seconds after each.</p><p>3. Stand 15 minutes.</p><p>4. Pass: evenly cloudy or evenly milky, and shakes back uniform.</p><p>5. Fail: flocs, lumps, oil layer, oil beads, caked sediment, colour change or heat.</p><p>6. On fail, spray separately. Do not force the mix.</p>'],
  ['Higher loading is not higher efficacy: think in g a.i./acre','CALC<p>250 g/L or 430 g/L on the label is the concentration in the bottle, not the dose in the field.</p><p>The field dose is <b>grams of active per acre or per tank</b>. One litre of a 250 g/L product and 0.58 litre of a 430 g/L product put the same amount on the tree.</p><p>Loading changes freight, packaging and measuring. It does not change efficacy. Compare products <b>at equal active dose</b>: which type takes up faster, protects longer, is safer, keeps better.</p>'],
  ['Water quality: hardness, pH, temperature','<p><b>Hard water</b> (common from wells and hill streams): calcium and magnesium break emulsions and dispersions. Use a water conditioner or a hard-water-tolerant product.</p><p><b>pH</b>: most actives are most stable slightly acid (5.5–6.5); alkaline water (pH above 8) breaks some down within hours.</p><p><b>Temperature</b>: warm water (above 30°C) breaks emulsions more easily and speeds decomposition. Use water at ambient temperature.</p>'],
  ['Getting more from a protectant: coverage, retention, timing','<p>One correction first: systemic or not is a property of the <b>active</b>, not the formulation. Mancozeb as an EW is still a contact protectant. The active cannot move, so efficacy comes down to three things: where it lands, how long it stays, and whether it is still alive when the spore arrives.</p><p><b>1. Coverage, the biggest lever.</b> A protectant only protects the square millimetres it touches. Miss the leaf underside, the fruit stalk, the crotch, and the fungus walks in there. Practice: spray to glisten, not to run-off; hollow-cone nozzles for a finer droplet; both sides of the canopy; walk slower. Pruning durian for spray penetration is a protectant enhancer in its own right.</p><p><b>2. Adjuvants, each solving one specific failure:</b></p><table><tr><th>Problem</th><th>Adjuvant</th><th>Caution</th></tr><tr><td>Droplets bead up on waxy leaf</td><td>Spreader / wetter (non-ionic surfactant)</td><td>Organosilicone super-spreaders give total coverage but can run straight off and push the active into stomata; phytotoxic on flush and young fruit</td></tr><tr><td>Rain washes it off</td><td>Sticker (latex, pinolene, resin) or spreader-sticker</td><td>Too much sticker stops the deposit re-wetting and redistributing</td></tr><tr><td>Deposit dries patchy in heat</td><td>Humectant (glycerol type)</td><td>Minor</td></tr><tr><td>Hard water, wrong pH</td><td>Water conditioner, acidifier / buffer</td><td>Copper and mancozeb both lose activity in alkaline water; check pH before anything else</td></tr></table><p><b>3. Timing: a protectant must be there first.</b> Spray ahead of the rain that triggers infection, not after. Re-apply after about 25 mm of rain or two to three weeks, whichever comes first. The cheapest enhancement and the one most often done wrong.</p><p><b>4. Choose within the protectant family.</b> Finer particles, a good SC or WG at 1–3 µm, cover more surface per gram than a coarse WP and redistribute better with dew; CS stretches the interval. Copper and mancozeb actually rely on light rain and dew to redistribute across the leaf, so use a moderate sticker, not a heavy one.</p><p><b>5. Pair it with a systemic.</b> A multi-site protectant with a single-site systemic is not just additive: the protectant covers what the systemic misses, and the mixture slows resistance to the systemic. That is why it is the standard pairing.</p><p><b>What adjuvants cannot do:</b> make a non-systemic active systemic. A penetrant can push some actives a little way into the leaf (translaminar), but a true contact protectant like copper stays on the surface whatever you add. If you need the chemical inside the tissue, you need a different molecule, not a better adjuvant.</p>'],
  ['Adjuvant glossary: what these words in the app mean','<table><tr><th>Term</th><th>What it is</th><th>When</th></tr><tr><td>Surfactant</td><td>A molecule with a water-loving head and oil-loving tail; the basis of all spreading, emulsifying and dispersing</td><td>—</td></tr><tr><td>Non-ionic</td><td>A surfactant whose head carries no charge (alcohol ethoxylates, organosilicones, polysorbates). Does not react with hard-water calcium and magnesium, does not flocculate suspensions, low foam, works at any pH</td><td>What a label means by \'add a wetter\'</td></tr><tr><td>Anionic</td><td>Negatively charged head (sulphates, sulphonates). Dishwashing liquid, laundry detergent. Heavy foam, precipitates in hard water</td><td>Never in a spray tank</td></tr><tr><td>Spreader / wetter</td><td>Lowers surface tension so spray films over waxy leaf instead of beading</td><td>When the spray beads; never in flush</td></tr><tr><td>Penetrant</td><td>Pushes the active through wax into the leaf. Organosilicone \'super-spreaders\' are the strongest kind</td><td>Systemics and curative sprays; protectants do not need it; not on young leaves</td></tr><tr><td>Sticker</td><td>Latex, pinolene, resin; glues the deposit to the leaf against rain</td><td>Before rain; moderate with copper and mancozeb so dew can still redistribute them</td></tr><tr><td>Mineral oil / COC</td><td>Paraffinic oil plus emulsifier; the mildest oil adjuvant; smothers scale and mites</td><td>Hardened leaves, 0.5–1%; one oil per tank</td></tr><tr><td>MSO, methylated seed oil</td><td>Vegetable oil converted to methyl esters (the biodiesel reaction); thinner and more penetrating than raw oil</td><td>Often named on herbicide labels; the least gentle oil on a crop, keep off flush</td></tr><tr><td>Neem / orange oil</td><td>See the mix-order warnings</td><td>Each on its own, alternated week by week</td></tr><tr><td>Water conditioner</td><td>Ammonium sulphate, acidifier, buffer; handles hard water and pH</td><td>When the label or the water calls for it, added first</td></tr><tr><td>Drone adjuvant</td><td>Anti-drift plus anti-evaporation, designed for 10–15 L of water per acre, often with a low share of methylated oil</td><td>Drones only, at its own rate; ground oils are not a substitute</td></tr></table>'],
  ['Drones: same dose, different carrier','<p>Ground spraying uses about 300 L of water per acre; a drone carries 10–15 L. <b>The tree needs exactly the same grams of active</b>; only the water is 25 times less, which is why the same dose is 25 times as concentrated in the tank.</p><p><b>Why the dose must not be cut:</b> less active is under-dosing, weaker control, and for fungicides a resistance selection pressure. The \'drones save 20–30% product\' claim is about less overspray on the ground, not a licence to feed the tree less; if the label has no drone rate, use the full per-acre rate.</p><p><b>What the carrier is:</b> everything in the tank except the active: water, solvent, emulsifier, surfactant, oil, adjuvant. On the ground the carrier is almost all water; take the water away and the rest stands out, and that is where drone scorch comes from.</p><p><b>Changing the carrier, four things:</b></p><p>1. Change the formulation type: same active, different carrier package. EC (solvent plus emulsifier) to SC (water plus dispersant) or OD (a light oil designed for low volume). WP to WG or SC.</p><p>2. Change the adjuvant: ground spreaders and farm oils out; a drone-labelled anti-drift, anti-evaporation product in, at its own rate.</p><p>3. Accept the drone\'s water: 10–15 L is what it carries; do not fly twice to \'add water\'.</p><p>4. Change the timing: the carrier is most concentrated as it lands, so keep off flush, flowers and midday.</p><p><b>A durian example:</b> ground spraying puts 400 ml of a 250 EW (100 g active) per acre in 300 L. Wrong conversion: 400 ml into 12 L. Right conversion: the same 100 g active = 230 ml of a 430 SC, in 12 L with a drone adjuvant, early morning on hardened leaves. The active never moved; the vehicle did.</p><p>Check any per-acre conversion by active, not by ml, in Compare two bottles.</p><p><b>Hectare to acre:</b> divide a per-hectare figure by 2.471. So 600 ml/ha = 243 ml/acre, and 20 L/ha = 8.1 L/acre. Divide the product and the water by the same number and the tank concentration does not change.</p>'],
  ['Drone tank: how much per tank','DCALC']
 ]},
ms:{search:'Cari kod atau nama, cth. EW, ampaian',kDrone:'Dron',droneL:['elak','berhati-hati','boleh','dibuat untuknya'],droneWhy:{OD:'fasa minyak membawa anti-sejat dan penyebaran terbina; formulasi dron pilihan di China',UL:'ULV khas, pekat atau dicairkan minyak',OF:'ULV khas',SC:'zarah halus, berasaskan air, tiada pelarut; jenis racun kulat dron paling biasa; terus kacau',ME:'sudah larut, titisan sub-mikron, jernih dan stabil, tiada yang tersumbat',EW:'sudah larut, titisan halus, tiada yang tersumbat',SL:'larutan sebenar, tiada yang tersumbat atau mendap; tetapi dengan air yang cukup sedikit bahan aktif boleh melepasi had keterlarutan dan menghablur, terutama dengan baja dalam tangki',EC:'boleh guna, tetapi semburan darat guna kira-kira 300 L air seekar dan dron kira-kira 12 L, jadi dos yang sama kira-kira 25 kali lebih pekat dalam tangki; tanpa kadar dron pada label, jangan tukar sendiri',WG:'hanya jika sebar sepenuhnya dalam baldi dahulu dan produk dikisar halus',WP:'zarah kasar menghauskan pam dan menyumbat muncung halus',CS:'pam tekanan tinggi mungkin memecahkan dinding kapsul, pelepasan perlahan jadi sekali lepas, melainkan label atau pengeluar memberi kadar dron',ZC:'mengandungi kapsul, seperti CS',ZE:'mengandungi kapsul, seperti CS'},droneSL:'SL dalam tangki dron: perhatikan had keterlarutan. Kurang air bermakna kepekatan lebih tinggi, dan melebihi apa yang bahan aktif boleh larutkan anda dapat hablur atau pengasinan, jernih dalam tangki tetapi menyumbat muncung di udara. Baja foliar dan garam lain memburukkannya. Ujian botol pada kepekatan dron sebenar.',droneSolid:'{list} dalam tangki dron membawa sepuluh hingga dua puluh kali beban pepejal semburan darat: penyebaran tidak lengkap, pemendapan, penapis dan muncung tersumbat, mendapan dalam hos. Sebarkan sepenuhnya dalam baldi sebelum dimuat, kacau sepanjang masa, bilas penapis selepas setiap tangki.',droneAdjRate:'<b>Periksa unit pada label adjuvan.</b> Peratusan (0.05–0.1%) dan jumlah seekar bukan saling tukar: 0.1% dalam 500 L/ha di darat ialah 500 ml/ha; 0.1% yang sama dalam dron pada 20 L/ha hanya 20 ml/ha, hampir tiada; memaksa 500 ml/ha ke dalam 20 L menjadikan larutan organosilikon 2.5%, yang melecur. Baca unit mana label beri dan ikut angka dron.',droneCanopy:'Kanopi durian tinggi dan berlapis: dron menyembur dari atas meliputi bahagian atas dengan baik dan sering meninggalkan kanopi tengah, bawah dan dalam. Penyakit batang dan akar tidak diselesaikan oleh satu laluan dron pada kanopi; menyapu batang dan mencurah tanah masih perlu dilakukan.',droneLabel:'<b>Malaysia: racun perosak hanya boleh dimuatkan ke dalam dron jika ia didaftarkan dengan Lembaga Racun Makhluk Perosak (LRMP) dan labelnya membawa saranan penggunaan UAS.</b> Aplikasi ini menerangkan sains formulasi dan pengiraan; ia tidak menggantikan label. Periksa label atau SISMARP untuk kelulusan dron.',dcal:{title:'Kalkulator campuran dron',unit:'Unit keluasan',unitL:['ekar','hektar'],rate:'Kadar label se{u}',vol:'Isipadu semburan se{u} L',tank:'Tangki dron L',flow:'Aliran L/min',speed:'Kelajuan km/j',swath:'Lebar semburan berkesan m',calib:'Tidak tahu isipadu semburan? Kira daripada aliran, kelajuan dan lebar',calibOut:'Kira-kira {v} L/{u}',useIt:'Guna angka ini',perTank:'Produk setiap tangki',covers:'Satu tangki meliputi',conc:'Kepekatan tangki',jarTitle:'Resipi ujian botol (buat 1 liter)',jarNote:'Campur jumlah ini ke dalam 1 liter dalam botol jernih dan biar 15–30 minit. Mendapan, serpihan, hablur, lapisan minyak, lapisan krim, gel atau lumpur → jangan campur. Ujian botol pada cairan darat tidak dikira.',fill:'Masukkan kadar label dan isipadu semburan',warnLow:'Bawah 4 L/ekar (kira-kira 10 L/ha) pemendapan menjadi lebih buruk. Pelindung sentuhan dan racun serangga sentuhan terutamanya perlukan lebih air. Itu keputusan satu kajian, titik permulaan bukan peraturan.',covNote:'Tentukan liputan yang diperlukan dahulu, kemudian isipadu semburan; bukan serendah yang dron boleh terbang. Sistemik boleh kurang, produk sentuhan dan pelindung perlu lebih.',drop:'Titisan: sederhana hingga kasar, sekitar 250–320 µm, ialah titik permulaan biasa. Terlalu halus hanyut dan sejat; terlalu kasar memberi kurang titisan dan liputan lemah. Laraskan mengikut pemendapan sebenar.'},grpNames:{emu:'Emulsi: titisan minyak dalam air',sus:'Ampaian: zarah pepejal dalam air',cap:'Jenis kapsul: bahan aktif dalam kapsul',sol:'Larutan: larut sepenuhnya dalam air',ulv:'Cairan minyak / ULV: tanpa air',dry:'Ditabur kering: tanpa air'},backTo:'Kembali ke kad {c}',cmp:{btn:'Banding',btnOn:'Dipilih',pick1:'{a} dipilih, tekan Banding pada jenis lain',title:'{a} lawan {b}',clear:'Batal',toPrice:'Banding harga dua botol →',rowDilute:'Dalam tangki',rowAgit:'Kacauan',rowDrone:'Dron',rowAvail:'Di rak Malaysia',rowStore:'Simpanan',rowSafe:'Keselamatan',better:'lebih baik',same:'sama',note:'●●● terbaik, ○○○ terburuk. Petak hijau ialah pihak lebih baik dalam baris itu. Markah ialah pertimbangan pengalaman.'},about:{title:'Kongsi dan penghargaan',share:'Imbas untuk membuka aplikasi ini, atau kongsi dengan petani lain',link:'stanleywoosweeleong.github.io/emulsiontypes',copy:'Salin pautan',copied:'Disalin',send:'Kongsi ke WhatsApp',credit:'Diilhamkan daripada perkongsian murah hati Dr. Lim Ing Keat tentang pelbagai jenis formulasi emulsi.'},kAvail:'Di rak Malaysia',availL:['hampir tiada','jarang','ada','biasa'],rare:'jarang',

 oilCarriers:{EC:'EC',ME:'ME',DC:'DC',OD:'OD',EO:'EO',oil:'minyak mineral / sayuran'},warnOilStack:'<b>{n} pembawa minyak atau pelarut dalam satu tangki: {list}. Satu setangki.</b><br>Bukan minyak yang melecur tetapi tiga perkara yang datang bersamanya: pelarut EC melarutkan lilin kutikel sebaik mendarat; pakej pengemulsi setiap produk bertindan dan menolak semburan masuk ke dalam sel; lapisan minyak lebih tebal menyumbat stoma dan matahari petang memasak daun.<br>Pucuk, bunga dan buah bawah saiz bola golf terkena dahulu; daun keras tahan, sebab itu campuran sama tidak apa-apa minggu lepas dan memusnahkan pucuk minggu ini.<br>Ujian botol menunjukkan sama ada campuran kekal bercampur, bukan sama ada ia melecur. Semasa pucuk atau berbunga jangan cuba, sembur berasingan.',qty:'produk',warnDupSolv:'{n} produk {c} dalam satu tangki: pelarut dan pengemulsi bertindan, risiko lecur pada pucuk, buah muda dan bunga naik mendadak; dua sistem pengemulsi juga boleh bertembung dan satu produk terapung. Ujian botol, elak tengah hari, sembur berasingan jika boleh.',warnDupSusp:'{n} produk {c} dalam satu tangki: beban zarah berganda, penyebar bersaing, jadi penggumpalan, pemendapan dan muncung tersumbat lebih mungkin. Kacau lebih kuat dan ujian botol.',warnDupOther:'{n} produk {c} dalam satu tangki: jenis sama bukan jaminan keserasian. Ujian botol.',warnEmuAdj:'{c} sudah membawa pengemulsinya sendiri, iaitu surfaktan yang menyebarkan dan menembus. Penyebar atau penembus tambahan kebanyakannya hanya membawa aliran dan lebih serapan ke dalam daun; dengan ME jangan sekali-kali. Lihat daun dahulu: jika selepas beberapa semburan cecair duduk sebagai titisan bulat dan tidak menyebar menjadi lapisan, itu manik, liputan lemah, dan hanya ketika itu tambah pembasah bukan ionik pada kadar label terendah; jika daun sudah berlapisan, jangan. Semasa berpucuk, tiada pembasah walau bagaimana rupa daun tua: daun muda belum ada lapisan lilin, tugas pembasah ialah menembusi lilin, dan tanpa lilin ia menolak produk terus ke tisu lembut, dari situlah lecur dan daun cacat datang. Pelekat tidak mengapa.',warnSLEmu:'SL bersama {c} dalam satu tangki: banyak SL ialah garam (garam amina atau kalium), dan beban elektrolit tinggi memecahkan emulsi seperti air keras, minyak berkumpul menjadi lapisan. Ikut urutan yang diberi, emulsi masuk sebelum SL, dan jika ujian botol menunjukkan lapisan minyak, sembur berasingan. SL sendiri tiada minyak; slot minyak sudah diambil oleh {c}, jadi tiada adjuvan minyak.',warnMany:'Lebih tiga produk dalam satu tangki menggandakan risiko keserasian. Jangan langkau ujian botol.',

 pickPurpose:'Semburan ini untuk apa?',purpose:['Langkau','Cegah: penyakit belum ada (P)','Rawat: penyakit baru muncul (C)','Hapus: lesi sudah meluas (E)'],purposeNote:{1:'Pencegahan bergantung pada lapisan yang kekal di daun. S, P, C, E milik bahan aktif; formulasi tidak mengubahnya, hanya menentukan berapa banyak anda dapat. Ditanda: lapisan perlindungan tahan lama. Pelindung ditingkatkan melalui liputan, lekatan dan masa; lihat Prinsip.',2:'Rawatan perlu bahan aktif masuk ke dalam daun, jadi hanya bahan aktif sistemik (S) boleh merawat. Formulasi tak boleh menjadikan bahan bukan sistemik menjadi sistemik, tetapi bentuk terlarut (EC, EW, ME) masuk lebih cepat daripada zarah pepejal. Ditanda: serapan cepat.',3:'Penghapusan perlu bahan aktif sistemik (S), penembusan ke lesi sedia ada, serta dos penuh. Formulasi satu tuil, tetapi sama ada bahan aktif boleh menghapus ditentukan oleh molekul. Ditanda: serapan cepat dan tahan hujan.'},

 mixWhat:'Apa yang masuk tangki?',mixStage:'Keadaan pokok sekarang',stages:['Biasa','Sedang berpucuk','Berbunga atau buah kecil'],stageNote:{1:'Berpucuk: daun muda belum ada lapisan lilin, jadi risiko lecur minyak, pelarut dan penyebar paling tinggi.',2:'Berbunga atau buah kecil: bunga dan buah kecil gugur sebaik melecur. Jangan campur minyak atau EC pada peringkat ini; sembur berasingan.'},stageEsc:'<b>Pokok sedang {s}: amaran di atas bukan \'berhati-hati\', ia \'sembur berasingan\'.</b> Jangan bertaruh pada ujian botol; tunggu pucuk keras atau buah stabil sebelum mencampur.',droneOil:'<b>Minyak ini tidak boleh masuk tangki dron: {list}.</b> Minyak di darat bergantung pada 300–400 L air untuk menyebarkan 0.5–1% minyak dengan nipis; dron membawa 10–15 L seekar, jadi peratusan yang sama ialah 15–30 kali kurang minyak dan tidak berkesan, dan minyak seekar yang sama menjadikan tangki 15–30% minyak yang tiada pengemulsi dapat pegang, mendarat hampir minyak tulen, melecur, dan melekit pam dan muncung. Dron hanya guna adjuvan anti-hanyut dan anti-sejat yang labelnya menyebut penggunaan dron.',droneCap:'<b>Periksa dahulu sebelum jenis kapsul masuk dron ({list}).</b> Pam dron berjalan pada tekanan dan ricih tinggi dan mungkin memecahkan dinding kapsul, menjadikan pelepasan perlahan sekali lepas: anda bayar untuk kapsul dan sembur produk biasa. Sesetengah produk kapsul direka menahan ricih; guna hanya jika label atau pengeluar memberi kadar dron. Jika tiada siapa boleh jawab, guna SC atau EW.',droneWP:'<b>WP tidak boleh masuk dron.</b> Zarah kasar, muncung halus, pasti tersumbat. Guna SC atau WG (pastikan sebar sepenuhnya sebelum dimuat).',droneEC:'EC dalam tangki dron: semburan darat guna kira-kira 300 L air seekar, dron kira-kira 12 L, jadi dos yang sama kira-kira 25 kali lebih pekat, termasuk pelarut. Bukan semasa berpucuk atau berbunga; selain itu guna kadar dron pada label, dan jika label tiada kadar dron, jangan tukar sendiri.',droneNote:'<b>Jangan kurangkan dos untuk dron.</b> Bahan aktif seekar kekal sama seperti semburan darat; hanya air yang kurang. Yang berubah ialah pembawa: EC kepada SC atau OD, penyebar darat dan minyak kepada adjuvan dron, dan elak pucuk dan bunga. Kadar dikira seekar, bukan setangki. Lihat Pilih atau baris Dron pada setiap kad jenis untuk jenis yang sesuai; Berapa setiap tangki: guna Tangki dron dalam Prinsip. Butiran dalam bahagian Prinsip terakhir.',sprayerFrom:'Penyembur',grpPest:'Racun perosak',grpAdj:'Adjuvan · baja · minyak',version:'Versi',

 mixOther:{cond:'Adjuvan yang labelnya kata masuk dahulu (jenis lesitin, alkohol lemak etoksilat)',adj:'Penyebar / pelekat / penembus',dish:'Cecair pencuci pinggan — jangan; tekan untuk sebab',foliar:'Baja foliar (Ca, Mg, mikronutrien kelat)',oil:'Minyak mineral atau sayuran',humic:'Penambah (jenis asid fulvik / humik)',faa:'Baja cecair fermentasi (asid amino ikan, eko-enzim)',neem:'Minyak neem',orange:'Minyak oren (d-limonena)'},warnNeem:'Minyak neem: neem perahan sejuk tidak teremulsi sendiri; pracampur dalam baldi air suam dengan pengemulsi sebelum tangki, atau beli neem EC yang diformulasi. Azadirachtin terurai dalam cahaya matahari dan air beralkali: sembur lewat petang, habiskan tangki hari yang sama. Guna 0.5–1%, daun keras sahaja, elak pucuk dan berbunga.',warnOrange:'Minyak oren ialah pelarut, bukan lemak: 0.1–0.2% penyebar-penembus yang baik; melebihi kira-kira 0.5% ia menanggalkan lilin daun, melecurkan pucuk dan bunga, dan merosakkan getah penyembur lama.',warnBoth:'<b>Jangan letak neem dan minyak oren dalam tangki yang sama.</b> Minyak oren ialah pelarut dan menolak neem ke dalam daun: dua minyak tambah satu pelarut. Selang-selikan minggu demi minggu: neem minggu ini untuk sisik dan hama, minyak oren minggu depan untuk menumbangkan koya dan afid.',botPair:{title:'{b} bertembung dengan yang lain dalam tangki:',oil:'tambah minyak mineral atau sayuran → dua minyak bertindan, risiko lecur berganda. Pilih satu.',spread:'tambah penyebar / penembus / cecair pencuci pinggan → minyak botani sudah menjadi penyebar-penembus; bertindan hanya bermakna aliran dan lilin tertanggal. Buang penyebar.',solv:'dengan EC / ME / DC → racun sudah membawa pelarut dan surfaktan berat; tambah minyak botani, pucuk dan bunga berisiko tinggi. Ujian botol, separuhkan kadar, atau sembur berasingan.',od:'dengan OD → OD sudah berasaskan minyak, tambah minyak jadi dua minyak. Pilih satu.',cap:'dengan jenis kapsul (CS, ZC, ZW, ZE) → minyak oren ialah pelarut dan melarutkan dinding kapsul, pelepasan perlahan menjadi sekali lepas. Sembur berasingan.',alk:'dengan penambah beralkali → azadirachtin terurai dalam air beralkali dalam beberapa jam, jadi sia-sia. Sembur berasingan.',ca:'dengan baja foliar Ca/Mg → kalsium dan magnesium memecahkan emulsi, minyak berkumpul menjadi gumpalan, dan setiap gumpalan pada daun ialah bintik lecur. Ujian botol; jika berasingan, sembur berasingan.'},warnBot:'Minyak neem dan minyak oren:<br>1. Minyak neem perahan sejuk tidak teremulsi sendiri: pracampur dalam baldi air suam dengan pengemulsi sebelum tangki, atau beli neem EC yang diformulasi. Azadirachtin terurai dalam cahaya matahari dan air beralkali: sembur lewat petang, habiskan tangki hari yang sama.<br>2. Minyak oren ialah pelarut, bukan lemak: 0.1–0.2% penyebar-penembus yang baik, melebihi kira-kira 0.5% ia menanggalkan lilin daun, melecurkan pucuk dan bunga, dan merosakkan getah penyembur lama.<br>3. Kedua-duanya dikira minyak: bukan dengan sulfur, klorotalonil atau kaptan; jangan tambah minyak atau penyebar lain, ia sendiri penyebar dan lebih hanya bermakna aliran dan lecur; elak panas tengah hari.<br>4. Jangan letak neem dan minyak oren dalam tangki yang sama juga: minyak oren ialah pelarut dan menolak neem ke dalam daun, dua minyak tambah satu pelarut. Selang-selikan minggu demi minggu.',warnFAA:'Asid amino ikan dan fermentasi eko-enzim:<br>1. Tapis dengan kain dahulu: hampas ikan, sisik dan sisa gula ialah penyumbat muncung nombor satu.<br>2. Asid amino mengkelat logam; dalam tangki dengan kuprum atau mankozeb ia melemahkan racun kulat, dan fermentasi ini berasid (kira-kira pH 4), yang juga meningkatkan fitotoksik kuprum.<br>3. Sebarang racun kulat dalam tangki membunuh mikrob hidupnya; boleh sebagai nutrisi tulen, sembur berasingan jika mahukan kesan mikrob.<br>Guna pada 1:500 hingga 1:1000 dan habiskan tangki pada hari yang sama.',blockDish:'<b>Keluarkan cecair pencuci pinggan dari tangki dan urutan campuran akan muncul.</b> Tiada situasi yang memerlukannya.',warnDish:'<b>Cecair pencuci pinggan bukan penyebar.</b> Ia nampak berkesan, titisan berhenti membentuk manik atas daun, sebab itu tabiat ini kekal; yang tak nampak ialah kosnya dua minggu kemudian.<br>1. Penyahgris melarutkan lemak, dan kutikel daun ialah lilin: pucuk dan buah muda melecur, daun matang hilang penghalang hujannya sendiri berminggu-minggu.<br>2. Kandungan tak diketahui: pewangi, pewarna, agen antibakteria, garam pemekat, pH dari 7 hingga 10; tiada satu pun diuji dengan racun, ada yang menggumpalkan SC.<br>3. Buih: separuh tangki buih menyembunyikan paras air, pam menyedut udara, sepertiga terakhir menyembur udara.<br>4. Dos hanya tekaan: satu penutup botol dalam 16 L boleh 0.05% atau 0.5%.<br>Penyebar bukan ionik pertanian berharga beberapa ringgit setangki dan buat kerja sama yang nampak tanpa kos yang tak nampak.',warnHumic:'Produk fulvik dan humik tiada bukti kukuh meningkatkan pelindung sentuhan (mankozeb, kuprum, klorotalonil); dengan kuprum ia boleh mengurangkan aktiviti. Periksa pH produk dahulu: humat kalium biasanya beralkali (pH 8–10) dan mengurai mankozeb serta sesetengah racun serangga. Sentiasa ujian botol.',

 calc:{title:'Banding dua botol',packHint:'Pek biasa',wvHint:'Jika label tulis 25% w/v pilih % w/v; untuk label w/w guna angka g/L di sebelahnya.',ta:'Produk A',tb:'Produk B',form:'Bentuk',liq:'Cecair (g/L)',sol:'Pepejal (%)',load:'Kandungan',pack:'Pek',price:'Harga RM',rate:'Kadar label',ru:{tank:'setangki',per100:'setiap 100 L',ratio:'nisbah 1 :'},tank:'Saiz tangki L',ai:'Bahan aktif setangki',measure:'Sukat setangki',cost:'Kos setangki',perG:'Setiap gram bahan aktif',vFill:'Isi kedua-dua produk dan keputusan muncul di sini. Kadar mesti dari label; aplikasi tidak mencadangkan dos.',vSame:'Dos sama. {c} lebih murah {p}% setiap gram bahan aktif dan menjadi pilihan lalai.',vDiff:'Pada kadar label {a} memberi {p}% lebih bahan aktif setangki berbanding {b}. Label bukan dos yang sama, jadi banding harga tidak bermakna sehingga anda tahu dos mana yang betul.',inert:'{c} meletakkan {p}% lebih formulasi pada pokok setangki, jadi lebih minyak, pelarut dan surfaktan bersamanya.',vEq:'Dos sama dan harga segram sama. Pilih ikut simpanan dan kemudahan menyukat.'},
