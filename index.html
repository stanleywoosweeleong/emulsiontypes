 sci:[
  ['Apa itu emulsi?','<p><b>Minyak dan air tidak bercampur.</b> Tuang bersama, ia berasingan menjadi dua lapisan. Goncang kuat, minyak pecah menjadi titisan kecil dalam air, tetapi sebaik berhenti, titisan berlanggar, bergabung, dan dalam beberapa minit dua lapisan terbentuk semula.</p><p><b>Emulsi</b> ialah keadaan di mana titisan minyak itu kekal dalam air dan tidak bergabung. Yang membolehkannya ialah <b>pengemulsi</b>: molekul dengan kepala suka air dan ekor suka minyak. Pengemulsi berbaris di permukaan setiap titisan, ekor dalam minyak, kepala menghadap keluar, supaya titisan dipisahkan dan tidak bercantum bila bersentuh.</p><p>Emulsi yang anda sudah kenal: <b>santan</b> (titisan minyak dalam air, dipegang protein kelapa), susu, mayonis. Lapisan minyak yang terapung atas santan yang dibiarkan ialah emulsi sedang "creaming"; goncang sekali ia kembali.</p><p><b>Kenapa racun perosak perlu emulsi:</b> kebanyakan bahan aktif larut minyak dan langsung tidak larut air. Untuk menyebarkannya sekata dalam setangki air hanya ada dua jalan: larutkan dalam minyak dan emulsikan (EC, EW, ME), atau kisar menjadi serbuk halus dan ampaikan (SC, WP, WG).</p><p><b>Dua arah:</b> titisan minyak dalam air ialah <b>minyak dalam air</b> (EW; boleh dicairkan lagi dengan air). Titisan air dalam minyak ialah <b>air dalam minyak</b> (EO; pekat, seperti mentega).</p><p><b>Titisan lebih halus bermakna emulsi lebih stabil dan lebih jernih.</b> Titisan kasar beberapa mikron kelihatan seperti susu dan naik ke atas bila dibiarkan; titisan sangat halus bawah 0.1 µm hampir jernih dan tidak berasingan (ME).</p>'],
  ['Larutan, emulsi, ampaian: tiga keadaan selepas cair','<div class="three">JAR3</div><p><b>Larutan</b>: bahan aktif larut dalam air. Jernih. Tiada mendapan, tak perlu kacau (SL, SP, SG).</p><p><b>Emulsi</b>: bahan aktif larut dalam titisan minyak, titisan terapung dalam air. Rupa seperti susu. Titisan naik ke atas (creaming), jadi perlu goncang (EC, EW, ME).</p><p><b>Ampaian</b>: zarah pepejal tergantung dalam air. Keruh. Zarah mendap, jadi kacau berterusan (SC, WP, WG, CS).</p><p>Bahan aktif yang sama boleh dibuat jenis berbeza. Jenis mengubah <b>cara dan kelajuan ia masuk ke tumbuhan</b>, bukan keupayaannya membunuh perosak.</p>'],
  ['Keluarga emulsi sepintas lalu: kod E dan kod Z','<table><tr><th>Kod</th><th>Di mana minyak</th><th>Satu baris</th></tr><tr><td>EC</td><td>Dalam pelarut; teremulsi bila dicairkan</td><td>Klasik, pelarut paling banyak</td></tr><tr><td>EW</td><td>Titisan minyak sudah dalam air</td><td>EC dengan kurang pelarut</td></tr><tr><td>EO</td><td>Minyak membalut air</td><td>EW terbalik, anti-hanyut</td></tr><tr><td>ME</td><td>Titisan sangat halus, jernih</td><td>Tak perlu goncang, penembusan paling cepat</td></tr><tr><td>SE</td><td>Titisan minyak dan zarah pepejal</td><td>SC dan EW dalam satu botol</td></tr><tr><td>EG / EP</td><td>Dipegang pada butiran atau serbuk larut</td><td>EC tanpa pelarut cecair</td></tr><tr><td>ES</td><td>Seperti EW, dengan pewarna</td><td>Rawatan benih</td></tr><tr><td>DC</td><td>Pelarut bercampur air</td><td>Zarah halus terbentuk bila dicairkan</td></tr><tr><td>CS</td><td>Dibalut dalam kapsul</td><td>Lepas perlahan, paling selamat</td></tr><tr><td>ZC</td><td>Kapsul dan zarah pepejal</td><td>CS + SC</td></tr><tr><td>ZW</td><td>Kapsul dan titisan minyak</td><td>CS + EW</td></tr><tr><td>ZE</td><td>Kapsul, titisan dan zarah</td><td>CS + SE, tiga fasa</td></tr><tr><td>OL / OF / UL</td><td>Minyak ialah pencair</td><td>Tiada air: mesin kabus atau ULV</td></tr></table><p>Maksud Z: fasa cepat dan fasa perlahan dalam satu botol. Fasa cepat (pepejal atau titisan minyak) menumbangkan; kapsul meliputi dua hingga tiga minggu berikutnya. Harganya simpanan rapuh dan kos lebih tinggi.</p>'],
  ['Surfaktan: pembasah, penyebar, pengemulsi','<p>Bahan "lengai" bukan pengisi. Setiap satu ada tugas:</p><p><b>Pembasah</b> menjadikan serbuk mesra air supaya ia tenggelam, bukan terapung berkerak.</p><p><b>Penyebar</b> menyaluti setiap zarah supaya zarah tolak-menolak dan tidak menggumpal.</p><p><b>Pengemulsi</b> duduk di sempadan minyak-air supaya minyak boleh pecah jadi titisan halus dan kekal dalam air.</p><p>Kalsium dan magnesium dalam air keras merampas surfaktan ini; sebab itu air keras memecahkan emulsi dan memendapkan ampaian.</p>'],
  ['Kenapa botol rosak: lima jenis kegagalan','BOTTLE<table><tr><th>Apa dilihat</th><th>Jenis</th><th>Punca</th><th>Tindakan</th></tr><tr><td>Lapisan minyak di atas</td><td>EW, ME</td><td>Titisan naik dan bergabung</td><td>Goncang kuat. Jika lapisan kekal → emulsi pecah, buang</td></tr><tr><td>Mendapan yang boleh digoncang semula</td><td>SC, SE, OD</td><td>Zarah mendap</td><td>Normal. Goncang sebelum guna</td></tr><tr><td>Lapisan keras tak boleh goncang</td><td>SC, OD</td><td>Mendapan termampat (caking)</td><td>Buang. Ia menyumbat muncung</td></tr><tr><td>Berpasir, zarah membesar</td><td>SC</td><td>Zarah kecil larut dan tumbuh pada zarah besar (pertumbuhan hablur)</td><td>Buang. Zarah besar kurang berkesan dan menyumbat muncung</td></tr><tr><td>Pekat seperti gel</td><td>SC, OD</td><td>Pemekat atau penyebar gagal dalam panas</td><td>Jika tak cair dengan air → buang</td></tr></table><p>Corak: <b>cecair berasaskan air tak tahan panas</b>; jenis kering (WP, WG) paling tahan simpan. Stor di Malaysia sering melebihi 35°C, jadi habiskan cecair dalam satu musim.</p>'],
  ['Kelajuan mendap: saiz dan ketumpatan','<p>Zarah lebih besar dan berat mendap lebih cepat. Hukum Stokes: kelajuan mendap naik dengan kuasa dua diameter zarah. Diameter dua kali, kelajuan empat kali.</p><p>Jadi:</p><p>· SC berkualiti dikisar ke 1–3 µm dan ambil berhari-hari untuk mendap; yang murah berasingan dalam beberapa jam.</p><p>· Zarah WP jauh lebih kasar (5–20 µm), sebab itu kacauan tak boleh berhenti semasa sembur WP.</p><p>· Pemekat melambatkan mendapan dengan menjadikan air "lebih pekat", bukan menjadikan zarah lebih ringan.</p>'],
  ['Cara buat ujian botol','<p>1. Botol jernih, 1 liter air yang akan digunakan.</p><p>2. Tambah setiap produk pada nisbah ladang, mengikut urutan tangki, goncang 10 saat selepas setiap satu.</p><p>3. Biar 15 minit.</p><p>4. Lulus: keruh sekata atau putih susu sekata, dan kembali sekata bila digoncang.</p><p>5. Gagal: gumpalan, ketulan, lapisan minyak, manik minyak, mendapan keras, tukar warna atau panas.</p><p>6. Jika gagal, sembur berasingan. Jangan paksa campuran.</p>'],
  ['Kandungan tinggi bukan keberkesanan tinggi: kira g b.a./ekar','CALC<p>250 g/L atau 430 g/L pada label ialah kepekatan dalam botol, bukan dos di ladang.</p><p>Dos ladang ialah <b>gram bahan aktif seekar atau setangki</b>. Satu liter produk 250 g/L dan 0.58 liter produk 430 g/L meletakkan jumlah yang sama pada pokok.</p><p>Kandungan mengubah kos pengangkutan, pembungkusan dan penyukatan. Ia tidak mengubah keberkesanan. Bandingkan produk <b>pada dos bahan aktif yang sama</b>: jenis mana serap lebih cepat, lindung lebih lama, lebih selamat, lebih tahan simpan.</p>'],
  ['Kualiti air: kekerasan, pH, suhu','<p><b>Air keras</b> (biasa dari telaga dan sungai bukit): kalsium dan magnesium memecahkan emulsi dan penyebaran. Guna pelembut air atau produk tahan air keras.</p><p><b>pH</b>: kebanyakan bahan aktif paling stabil sedikit berasid (5.5–6.5); air beralkali (pH melebihi 8) mengurai sesetengahnya dalam beberapa jam.</p><p><b>Suhu</b>: air suam (melebihi 30°C) lebih mudah memecahkan emulsi dan mempercepat penguraian. Guna air suhu bilik.</p>'],
  ['Dapat lebih daripada pelindung: liputan, lekatan, masa','<p>Satu pembetulan dahulu: sistemik atau tidak ialah sifat <b>bahan aktif</b>, bukan formulasi. Mankozeb sebagai EW masih pelindung sentuhan. Bahan aktif tak boleh bergerak, jadi keberkesanan bergantung pada tiga perkara: di mana ia mendarat, berapa lama ia kekal, dan sama ada ia masih aktif bila spora tiba.</p><p><b>1. Liputan, tuil terbesar.</b> Pelindung hanya melindungi milimeter persegi yang disentuhnya. Terlepas bawah daun, tangkai buah, celah dahan, kulat masuk dari situ. Amalan: sembur hingga berkilat, bukan hingga menitis; muncung kon berongga untuk titisan halus; kedua-dua sisi kanopi; berjalan perlahan. Memangkas durian supaya semburan tembus kanopi ialah penambah pelindung dengan sendirinya.</p><p><b>2. Adjuvan, setiap satu menyelesaikan satu masalah:</b></p><table><tr><th>Masalah</th><th>Adjuvan</th><th>Perhatian</th></tr><tr><td>Titisan membentuk manik atas daun berlilin</td><td>Penyebar / pembasah (surfaktan bukan ionik)</td><td>Penyebar super organosilikon beri liputan penuh tetapi boleh terus mengalir dan menolak bahan aktif ke stoma; fitotoksik pada pucuk dan buah muda</td></tr><tr><td>Hujan menghanyutkannya</td><td>Pelekat (lateks, pinolena, resin) atau penyebar-pelekat</td><td>Pelekat berlebihan menghalang lapisan dibasahi semula dan tersebar semula</td></tr><tr><td>Lapisan kering bertompok dalam panas</td><td>Pelembap (jenis gliserol)</td><td>Kecil</td></tr><tr><td>Air keras, pH salah</td><td>Pelaras air, pengasid / penimbal</td><td>Kuprum dan mankozeb hilang aktiviti dalam air beralkali; periksa pH sebelum yang lain</td></tr></table><p><b>3. Masa: pelindung mesti ada dahulu.</b> Sembur sebelum hujan yang mencetus jangkitan, bukan selepas. Ulang selepas kira-kira 25 mm hujan atau dua hingga tiga minggu, mana lebih dahulu. Penambah paling murah dan paling kerap tersilap.</p><p><b>4. Pilih dalam keluarga pelindung.</b> Zarah lebih halus, SC atau WG yang baik pada 1–3 µm, meliputi lebih permukaan segram berbanding WP kasar dan tersebar semula lebih baik dengan embun; CS memanjangkan selang. Kuprum dan mankozeb sebenarnya bergantung pada hujan renyai dan embun untuk tersebar semula, jadi guna pelekat sederhana, bukan berat.</p><p><b>5. Gandingkan dengan sistemik.</b> Pelindung berbilang tapak dengan sistemik satu tapak bukan sekadar tambahan: pelindung meliputi apa yang sistemik terlepas, dan campuran melambatkan kerintangan terhadap sistemik. Sebab itu ia gandingan piawai.</p><p><b>Apa yang adjuvan tak boleh buat:</b> menjadikan bahan bukan sistemik menjadi sistemik. Penembus boleh menolak sesetengah bahan aktif sedikit ke dalam daun (translaminar), tetapi pelindung sentuhan sebenar seperti kuprum kekal di permukaan walau apa ditambah. Jika perlu bahan kimia di dalam tisu, perlukan molekul lain, bukan adjuvan lebih baik.</p>'],
  ['Glosari adjuvan: maksud perkataan ini dalam aplikasi','<table><tr><th>Istilah</th><th>Apa itu</th><th>Bila</th></tr><tr><td>Surfaktan</td><td>Molekul dengan kepala suka air dan ekor suka minyak; asas semua penyebaran, pengemulsian dan penyebaran</td><td>—</td></tr><tr><td>Bukan ionik</td><td>Surfaktan yang kepalanya tiada cas (alkohol etoksilat, organosilikon, polisorbat). Tidak bertindak balas dengan kalsium dan magnesium air keras, tidak menggumpalkan ampaian, buih rendah, berfungsi pada sebarang pH</td><td>Maksud label \'tambah pembasah\'</td></tr><tr><td>Anionik</td><td>Kepala bercas negatif (sulfat, sulfonat). Cecair pencuci pinggan, serbuk pencuci. Buih banyak, memendak dalam air keras</td><td>Jangan sekali-kali dalam tangki sembur</td></tr><tr><td>Penyebar / pembasah</td><td>Menurunkan tegangan permukaan supaya semburan berlapisan di daun berlilin dan bukan membentuk manik</td><td>Bila semburan membentuk manik; jangan semasa berpucuk</td></tr><tr><td>Penembus</td><td>Menolak bahan aktif melalui lilin ke dalam daun. \'Penyebar super\' organosilikon jenis paling kuat</td><td>Sistemik dan semburan rawatan; pelindung tidak perlukan; bukan pada daun muda</td></tr><tr><td>Pelekat</td><td>Lateks, pinolena, resin; melekatkan lapisan pada daun menentang hujan</td><td>Sebelum hujan; sederhana dengan kuprum dan mankozeb supaya embun masih boleh menyebarkannya semula</td></tr><tr><td>Minyak mineral / COC</td><td>Minyak parafin dan pengemulsi; adjuvan minyak paling lembut; melemaskan sisik dan hama</td><td>Daun keras, 0.5–1%; satu minyak setangki</td></tr><tr><td>MSO, minyak biji termetil</td><td>Minyak sayuran ditukar kepada metil ester (tindak balas biodiesel); lebih cair dan lebih menembus daripada minyak mentah</td><td>Sering disebut pada label racun rumpai; minyak paling tidak lembut pada tanaman, jauhi pucuk</td></tr><tr><td>Minyak neem / oren</td><td>Lihat amaran urutan campur</td><td>Setiap satu bersendirian, selang-seli minggu demi minggu</td></tr><tr><td>Pelaras air</td><td>Ammonium sulfat, pengasid, penimbal; mengendalikan air keras dan pH</td><td>Bila label atau air memerlukannya, ditambah dahulu</td></tr><tr><td>Adjuvan dron</td><td>Anti-hanyut dan anti-sejat, direka untuk 10–15 L air seekar, sering dengan sedikit minyak termetil</td><td>Dron sahaja, pada kadarnya sendiri; minyak darat bukan pengganti</td></tr></table>'],
  ['Dron: dos sama, pembawa berbeza','<p>Semburan darat guna kira-kira 300 L air seekar; dron membawa 10–15 L. <b>Pokok perlukan gram bahan aktif yang sama</b>; hanya air 25 kali kurang, sebab itu dos yang sama 25 kali lebih pekat dalam tangki.</p><p><b>Kenapa dos tidak boleh dikurangkan:</b> kurang bahan aktif ialah dos rendah, kawalan lemah, dan bagi racun kulat tekanan pemilihan kerintangan. Dakwaan \'dron jimat 20–30% produk\' adalah tentang kurang lebihan sembur ke tanah, bukan lesen memberi pokok kurang; jika label tiada kadar dron, guna kadar penuh seekar.</p><p><b>Apa itu pembawa:</b> semua dalam tangki kecuali bahan aktif: air, pelarut, pengemulsi, surfaktan, minyak, adjuvan. Di darat pembawa hampir semuanya air; ambil air itu dan yang lain menonjol, dan di situlah lecur dron datang.</p><p><b>Menukar pembawa, empat perkara:</b></p><p>1. Tukar jenis formulasi: bahan aktif sama, pakej pembawa berbeza. EC (pelarut dan pengemulsi) kepada SC (air dan penyebar) atau OD (minyak ringan direka untuk isipadu rendah). WP kepada WG atau SC.</p><p>2. Tukar adjuvan: penyebar darat dan minyak ladang keluar; produk anti-hanyut, anti-sejat berlabel dron masuk, pada kadarnya sendiri.</p><p>3. Terima air dron: 10–15 L ialah apa yang dibawanya; jangan terbang dua kali untuk \'tambah air\'.</p><p>4. Tukar masa: pembawa paling pekat semasa mendarat, jadi elak pucuk, bunga dan tengah hari.</p><p><b>Contoh durian:</b> semburan darat meletakkan 400 ml 250 EW (100 g bahan aktif) seekar dalam 300 L. Penukaran salah: 400 ml ke dalam 12 L. Penukaran betul: 100 g bahan aktif yang sama = 230 ml 430 SC, dalam 12 L dengan adjuvan dron, awal pagi pada daun keras. Bahan aktif tidak berganjak; kenderaannya yang berubah.</p><p>Semak sebarang penukaran seekar mengikut bahan aktif, bukan ml, dalam Banding dua botol.</p><p><b>Hektar ke ekar:</b> bahagikan angka sehektar dengan 2.471. Jadi 600 ml/ha = 243 ml/ekar, dan 20 L/ha = 8.1 L/ekar. Bahagikan produk dan air dengan nombor yang sama dan kepekatan tangki tidak berubah.</p>'],
  ['Tangki dron: berapa setiap tangki','DCALC']
 ]}

/* ---------- jar glyphs ---------- */
function jar(type,size){
  const s=size||46;
  let inner='';
  if(type==='sol') inner='<rect x="14" y="30" width="28" height="30" rx="4" fill="#dceef2"/>';
  else if(type==='emu') inner='<rect x="14" y="30" width="28" height="30" rx="4" fill="#f5eee0"/><circle cx="22" cy="36" r="2.5" fill="#c98a1b"/><circle cx="34" cy="38" r="3" fill="#c98a1b"/><circle cx="27" cy="46" r="2" fill="#c98a1b"/><circle cx="36" cy="50" r="2.5" fill="#c98a1b"/><circle cx="20" cy="54" r="2" fill="#c98a1b"/>';
  else if(type==='sus') inner='<rect x="14" y="30" width="28" height="30" rx="4" fill="#e6e3da"/><rect x="14" y="50" width="28" height="10" rx="3" fill="#8a8578"/><circle cx="22" cy="38" r="1.5" fill="#8a8578"/><circle cx="33" cy="42" r="1.5" fill="#8a8578"/><circle cx="27" cy="45" r="1.2" fill="#8a8578"/>';
  else if(type==='oil') inner='<rect x="14" y="30" width="28" height="30" rx="4" fill="#f2d99a"/><rect x="14" y="30" width="28" height="8" rx="3" fill="#e8c46a"/>';
  else inner='<circle cx="22" cy="40" r="3" fill="#8a8578"/><circle cx="33" cy="46" r="3" fill="#8a8578"/><circle cx="26" cy="52" r="3" fill="#8a8578"/><circle cx="36" cy="36" r="2.5" fill="#8a8578"/>';
  return `<svg width="${s}" height="${s}" viewBox="0 0 56 64" aria-hidden="true"><rect x="10" y="26" width="36" height="36" rx="6" fill="#fff" stroke="#c8d2cf" stroke-width="2"/><rect x="18" y="14" width="20" height="12" rx="2" fill="#fff" stroke="#c8d2cf" stroke-width="2"/><rect x="16" y="8" width="24" height="8" rx="2" fill="#1b5e6e"/>${inner}</svg>`;
}

  const q=libQ.trim().toLowerCase();
  const list = F.filter(f=> (!q || f.c.toLowerCase().includes(q) || f.n[lang].toLowerCase().includes(q) || f.n.en.toLowerCase().includes(q)) && (libFilter==='all' || (libFilter==='spray'?f.spray:libFilter==='emu'?f.fam==='emu':libFilter==='cap'?(f.fam==='cap'||f.c==='ZW'||f.c==='ZE'):f.phase===libFilter)));
  const exact = q && F.find(f=>f.c.toLowerCase()===q);
  const wasOpen=new Set([...document.querySelectorAll('#libList .card.open')].map(e=>e.id));
  const dil={sol:{zh:'透明溶液',en:'clear solution',ms:'larutan jernih'},emu:{zh:'乳白乳液',en:'milky emulsion',ms:'emulsi putih susu'},sus:{zh:'混浊悬浮液',en:'cloudy suspension',ms:'ampaian keruh'},dry:{zh:'不兑水，直接施用',en:'applied dry, no water',ms:'ditabur kering, tanpa air'},oil:{zh:'用油稀释或不稀释，不加水',en:'diluted in oil or used neat, not water',ms:'dicairkan dalam minyak atau digunakan pekat, bukan air'}};
  const ptag = {L:{zh:'液体',en:'liquid',ms:'cecair'},S:{zh:'固体',en:'solid',ms:'pepejal'}};
  const GRP=[['emu',['EC','EW','ME','EO','SE','DC','EG','EP','ES']],['sus',['SC','OD','WP','WG']],['cap',['CS','ZC','ZW','ZE']],['sol',['SL','SP','SG']],['ulv',['OL','OF','UL']],['dry',['DP','GR']]];
  const card=(f)=>`
  <div class="card ${(exact&&exact.c===f.c)||wasOpen.has('card-'+f.c)?'open':''}" id="card-${f.c}">
    <button class="head" onclick="this.parentElement.classList.toggle('open')">
      <span class="jar">${jar(f.dilute)}</span>
      <span class="t"><div class="code">${f.c}<em>${f.n[lang]}</em></div><div class="sub">${f.state[lang]}</div></span>
      <span class="chev">›</span>

    <div class="body">
      <div class="row" style="grid-template-columns:1fr"><span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><button class="chip ${getCmp().includes(f.c)?'on':''}" onclick="toggleCmp('${f.c}')">${getCmp().includes(f.c)?'✓ '+t('cmp').btnOn:t('cmp').btn}</button></span></div>
      <div class="row"><span class="k">${t('kDilute')}</span><span><span class="tag ${f.dilute==='emu'||f.dilute==='oil'?'oil':f.dilute==='sol'?'water':'powder'}">${dil[f.dilute][lang]}</span><span class="tag powder">${ptag[f.phase][lang]}</span></span></div>
      <div class="row"><span class="k">${t('kLoad')}</span><span>${f.load}</span></div>
      <div class="row"><span class="k">${t('kAgit')}</span><span><span class="dots">${'●'.repeat(f.agit)}${'○'.repeat(3-f.agit)}</span> ${t('agit')[f.agit]}</span></div>
      <div class="row"><span class="k">${t('kPro')}</span><ul class="pc pro">${f.pro[lang].map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="row"><span class="k">${t('kCon')}</span><ul class="pc con">${f.con[lang].map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="row"><span class="k">${t('kStore')}</span><span>${f.store[lang]}</span></div>
      <div class="row"><span class="k">${t('kSafe')}</span><span>${f.safe[lang]}</span></div>
      <div class="row"><span class="k">${t('kEx')}</span><span>${f.ex[lang]}</span></div>
      <div class="row"><span class="k">${t('kUse')}</span><span>${f.use[lang]}</span></div>
      <div class="row"><span class="k">${t('kDrone')}</span><span><span class="dots">${'●'.repeat(f.drone)}${'○'.repeat(3-f.drone)}</span> ${t('droneL')[f.drone]}${t('droneWhy')[f.c]?` — ${t('droneWhy')[f.c]}`:''}</span></div>
      <div class="row"><span class="k">${t('kAvail')}</span><span><span class="dots">${'●'.repeat(f.avail)}${'○'.repeat(3-f.avail)}</span> ${t('availL')[f.avail]}</span></div>
    </div>
  </div>`;
  const shown=new Set(list.map(f=>f.c));
  document.getElementById('libList').innerHTML = cmpHTML() + GRP.map(([g,codes])=>{
    const fs=codes.map(c=>F.find(f=>f.c===c)).filter(f=>f&&shown.has(f.c));
    return fs.length ? `<div class="grp">${t('grpNames')[g]}</div>`+fs.map(card).join('') : '';
  }).join('');
}

  return `<div class="cmptable"><div class="hrow" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:1.05rem">${C.title.replace('{a}',A.c+' '+A.n[lang]).replace('{b}',B.c+' '+B.n[lang])}</b><button class="btn-clear" onclick="clearCmp()">${C.clear}</button></div>

}

function renderMix(){
  let m=getMix().filter(c=>c!=='dish'); const out=document.getElementById('mixOut');
  const dishInfo = sessionStorage.getItem('fx_dishinfo')==='1' ? `<div class="note">${t('warnDish')}</div>` : '';
  if(!m.length){ out.innerHTML=dishInfo+`<div class="empty">${t('mixNone')}</div>`; return; }

  const groups=[
    ['cond',['cond']],
    ['dry',['WP','WG','SP','SG','EG','EP']],
    ['flow',['SC','CS','ZC','ZW','ZE','SE','OD']],
    ['emul',['EC','EW','ME','DC']],
    ['sol',['SL']],
    ['adj',['adj','foliar','faa','oil','neem','orange','humic']]
  ];
  const S=t('mixSteps'); const MO=t('mixOther');
  let steps=[`<div class="step"><div>${S.fill}</div></div>`];
  const refused = ((localStorage.getItem('fx_sprayer')||'0')==='2') ? ['oil','neem','orange','WP'] : [];
  groups.forEach(([key,codes])=>{
    const hit=codes.filter(c=>m.includes(c) && !refused.includes(c));
    if(!hit.length) return;
    const Q=getQty();
    const names = hit.map(c=>F.find(x=>x.c===c)?(Q[c]>1?`${c} ×${Q[c]}`:c):MO[c]).join(' → ');
    steps.push(`<div class="step"><div class="codes">${names}</div><div class="h">${S[key]}</div></div>`);
  });
  steps.push(`<div class="step"><div>${S.top}</div></div>`);
  steps.push(`<div class="step"><div>${t('mixSteps2').rinse}</div></div>`);
  let warns=[];
  const drone=(localStorage.getItem('fx_sprayer')||'0')==='2';
  if(drone){
    const MO3=t('mixOther'); const oils=['oil','neem','orange'].filter(c=>m.includes(c));
    if(oils.length) warns.push(t('droneOil').replace('{list}',oils.map(c=>MO3[c]).join('、')));
    if(m.includes('WP')) warns.push(t('droneWP'));
    const caps=['CS','ZC','ZE'].filter(c=>m.includes(c)); if(caps.length) warns.push(t('droneCap').replace('{list}',caps.join('、')));
    if(m.includes('EC')) warns.push(t('droneEC'));
    if(m.includes('SL')) warns.push(t('droneSL'));
    const sol=['WG','SC','SE','OD','SP','SG','ZC','WP'].filter(c=>m.includes(c)); if(sol.length) warns.push(t('droneSolid').replace('{list}',sol.join('、')));
    if(['adj','cond'].some(c=>m.includes(c))) warns.push(t('droneAdjRate'));
    warns.push(t('droneCanopy')); warns.push(t('droneLabel'));
    m=m.filter(c=>!['oil','neem','orange','WP'].includes(c));
  }
  const bots=['neem','orange'].filter(c=>m.includes(c));
  { const emu2=['EC','EW','ME','EO'].filter(c=>m.includes(c)); if(emu2.length && m.includes('SL')) warns.push(t('warnSLEmu').replace(/\{c\}/g,emu2.join(' / '))); }
  { const emu=['EC','EW','ME','SE','ZW','EO','DC'].filter(c=>m.includes(c)); if(emu.length && m.includes('adj') && !bots.length) warns.push(t('warnEmuAdj').replace('{c}',emu.join(' / '))); }
  const Qm=getQty(); const codes=m.filter(c=>F.find(x=>x.c===c)); const total=codes.reduce((a,c)=>a+(Qm[c]||1),0); if(total>3) warns.push(t('warnMany'));
  if(!bots.length){ const OC=t('oilCarriers'); const carriers=Object.keys(OC).filter(k=>m.includes(k)); if(carriers.length>=2){ const n=carriers.reduce((a,k)=>a+(Qm[k]||1),0); warns.push(t('warnOilStack').replace('{n}',n).replace('{list}',carriers.map(k=>OC[k]).join(' + '))); } }
  codes.filter(c=>(Qm[c]||1)>1).forEach(c=>{ const f=F.find(x=>x.c===c); const key=f.dilute==='emu'?'warnDupSolv':(f.dilute==='sus'?'warnDupSusp':'warnDupOther'); warns.push(t(key).replace('{c}',c).replace('{n}',Qm[c])); });
  const act=getAct().map(id=>ACT.find(a=>a.id===id)).filter(Boolean);
  const nm=(list)=>list.map(a=>a.n[lang]).join('、');
  const has=(tag)=>act.filter(a=>a.tags.includes(tag));
  if((m.includes('oil')||bots.length) && has('nooil').length) warns.push(t('warnOilAct').replace('{a}',nm(has('nooil'))));
  if(bots.length){
    if(m.includes('neem')) warns.push(t('warnNeem'));
    if(m.includes('orange')) warns.push(t('warnOrange'));
    if(bots.length===2) warns.push(t('warnBoth'));
    const P=t('botPair'); const pairs=[]; const MO2=t('mixOther');
    if(m.includes('oil')) pairs.push(P.oil);
    if(['adj','cond'].some(c=>m.includes(c))) pairs.push(P.spread);
    if(['EC','ME','DC'].some(c=>m.includes(c))) pairs.push(P.solv);
    if(m.includes('OD')) pairs.push(P.od);
    if(m.includes('orange') && ['CS','ZC','ZW','ZE'].some(c=>m.includes(c))) pairs.push(P.cap);
    if(m.includes('neem') && m.includes('humic')) pairs.push(P.alk);
    if(m.includes('foliar')) pairs.push(P.ca);
    if(pairs.length) warns.push(`<b>${P.title.replace('{b}',bots.map(c=>MO2[c]).join(' / '))}</b><br>`+pairs.map(x=>'• '+x).join('<br>'));
  }
  if(has('alk').length && m.includes('humic')) warns.push(t('warnAlkAct').replace('{a}',nm(has('alk'))));
  else if(has('alk').length) warns.push(t('warnAlkAct').replace('{a}',nm(has('alk'))));
  if(has('cu').length && has('phos').length) warns.push(t('warnCuPhos').replace('{a}',nm(has('phos'))));
  if(has('cu').length && has('captan').length) warns.push(t('warnCaptanCu'));
  if(has('heat').length) warns.push(t('warnSulHeat'));
  if(m.includes('foliar') && has('metal').length) warns.push(t('warnMetalChel').replace('{a}',nm(has('metal'))));
  if(m.includes('foliar')){ warns.push(t('warnFoliar')); if(!has('metal').length) warns.push(t('warnFoliarChel')); }
  if(m.includes('WP') && (m.includes('EC')||m.includes('DC'))) warns.push(t('warnWPEC'));
  if(m.includes('OD') && m.includes('WG')) warns.push(t('warnOD'));
  if(['CS','ZC','ZW','ZE'].some(c=>m.includes(c))) warns.push(t('warnCap'));
  if(m.includes('humic')) warns.push(t('warnHumic'));
  if(m.includes('faa')) warns.push(t('warnFAA'));
  if(m.includes('dish')) warns.push(t('warnDish'));
  const stage=+(sessionStorage.getItem('fx_stage')||0);
  const oily = m.includes('oil')||bots.length||['EC','ME','DC','OD','EO'].some(c=>m.includes(c))||['adj','cond'].some(c=>m.includes(c));
  if(stage>0 && oily && warns.length) warns.push(t('stageEsc').replace('{s}',t('stages')[stage]));
  out.innerHTML = dishInfo+`${warns.map(w=>`<div class="note">${w}</div>`).join('')}<div class="info">${t('jar')}</div><div class="steps">${steps.join('')}</div>
  <button class="seg-share" onclick="shareMix()">${t('share')}</button>
  <div class="info" style="margin-top:8px">${t('chemlog')} → <a href="https://stanleywoosweeleong.github.io/ChemLogLab2/" target="_blank" rel="noopener" style="color:var(--water);font-weight:700">ChemLog 2</a></div>`;
  window._mixShare={warns,steps};
}

function calcSet(el){
  const st=calcState(); const [a,b]=el.dataset.c.split('.');
  if(b){ st[a]=st[a]||{}; st[a][b]=el.value; } else st[a]=el.value;
  calcSave(st);

  document.getElementById('calcOut').innerHTML=calcOut();
}
function calcSetVal(k,name,v){

  calcSave(st); renderSci(); const d=document.getElementById('calcOut').closest('details'); if(d) d.open=true;

function calcPreset(k,v,u){
  const st=calcState(); st[k]=st[k]||{}; st[k].pack=v; st[k].pu=u;
  calcSave(st);
  renderSci(); const d=document.getElementById('calcOut').closest('details'); if(d) d.open=true;

function calcOne(p){
  const liq=(p.form||'liq')==='liq';
  let load=+p.load, pack=+p.pack; const price=+p.price, rate=+p.rate;
  if(!(load>0&&pack>0&&price>0&&rate>0)) return null;
  if(liq && p.lu==='% w/v') load=load*10;                 // % w/v → g/L
  if(liq && p.lu==='% w/w') load=load*10*((+p.den)||1);   // % w/w × density → g/L
  const pu=p.pu||(liq?'ml':'g'); if(pu==='L'||pu==='kg') pack=pack*1000;   // → ml or g
  const tank=+(calcState().tank)||16;
  let r=rate;                                       // amount per tank in ml or g
  if(p.ru==='per100') r=rate*tank/100;
  else if(p.ru==='ratio') r=tank*1000/rate;         // 1:rate → tank L ×1000 / rate
  const ai = liq ? r/1000*load : r*load/100;
  const cost = r/pack*price;
  return {ai,cost,perG:cost/ai,rate:r,unit:liq?'ml':'g'};
}
function calcOut(){
  const C=t('calc'), st=calcState(), A=calcOne(st.A||{}), B=calcOne(st.B||{});
  if(!A||!B) return `<div class="info">${C.vFill}</div>`;
  const f=(x,d)=>x.toLocaleString(undefined,{maximumFractionDigits:d});
  const rows=[[C.ai,`${f(A.ai,1)} g`,`${f(B.ai,1)} g`],[C.measure,`${f(A.rate,1)} ${A.unit}`,`${f(B.rate,1)} ${B.unit}`],[C.cost,`RM ${f(A.cost,2)}`,`RM ${f(B.cost,2)}`],[C.perG,`RM ${f(A.perG,3)}`,`RM ${f(B.perG,3)}`]];
  let tbl=`<table><tr><th></th><th>${C.ta}</th><th>${C.tb}</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`;
  const diff=Math.abs(A.ai-B.ai)/Math.max(A.ai,B.ai);
  let v='';
  if(diff>0.10){ const hi=A.ai>B.ai?'A':'B', lo=hi==='A'?'B':'A'; v=`<div class="note">${C.vDiff.replace('{a}',C[hi==='A'?'ta':'tb']).replace('{b}',C[lo==='A'?'ta':'tb']).replace('{p}',f(diff*100,0))}</div>`; }
  else { const pd=Math.abs(A.perG-B.perG)/Math.max(A.perG,B.perG);
    if(pd<0.02) v=`<div class="info">${C.vEq}</div>`;
    else { const c=A.perG<B.perG?'ta':'tb'; v=`<div class="info">${C.vSame.replace('{c}',C[c]).replace('{p}',f(pd*100,0))}</div>`; } }
  const rd=Math.abs(A.rate-B.rate)/Math.max(A.rate,B.rate);
  if(rd>0.25 && A.unit===B.unit){ const c=A.rate>B.rate?'ta':'tb'; v+=`<div class="note">${C.inert.replace('{c}',C[c]).replace('{p}',f(rd*100,0))}</div>`; }
  return `<div class="verdict">${tbl}${v}</div>`;
}

function dcalCalib(st){ const q=+st.flow,sp=+st.speed,w=+st.swath; if(!(q>0&&sp>0&&w>0)) return null; const ha=q*600/(sp*w); return (st.unit||'0')==='1' ? ha : ha/2.471; }

function dcalOut(){

  rows+=`<div class="rc"><div class="rc-h">${D.jarTitle}</div><div class="rc-v">${num(r/v)} ${U} + ${lang==='zh'?'水至':lang==='ms'?'air hingga':'water to'} 1 L</div><span class="rc-k">　</span><div class="rc-v">${D.jarNote}</div></div>`;

  return html+rows+`<div class="info">${D.covNote}</div><div class="info">${D.drop}</div>`;
}

function aboutHTML(){ const A=t('about'); const open=localStorage.getItem('fx_about_closed')!=='1';

function renderSci(){
